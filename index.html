      captions: {
        "home-1":{ caption:"Ahoj, som Jano", blurb:"Pracujem v Asseco CEIT a keď zrovna neprogramujem, najskôr hrám Factorio.", alt:"Portrét Jana pred Hlavnou stanicou v Drážďanoch v daždivý deň", note:"Prvý deň, Drážďany, a pršalo celý čas. Prišiel som sem programovať — nikto ma nevaroval, koľko z najbližších dvoch týždňov budem držať skrutkovač." },
        "home-2":{ caption:"Hrám aj na gitare", blurb:"Trocha hudby ako protiváha k času pri obrazovke.", alt:"Jano sedí doma s klasickou gitarou, na kolene zelený slovenský spevník a za ním knižnice", note:"To je ten zelený spevník, čo má pol Slovenska niekde v knižnici, a gitara, ktorá príde na rad vždy, keď obrazovka na ten deň vyhrala. Do kufra sa mi nezmestila — jediná vec, ktorú pri balení ľutujem." },
        "home-3":{ caption:"V rámci programu Erasmus+", blurb:"Dva týždne v Nemecku vďaka programu Erasmus+.", alt:"Grafika programu Erasmus+ na pozadí vlajky Európskej únie", note:"Bez Erasmu+ by z toho nebolo nič: dva týždne praxe v Nemecku, zaplatené programom, ktorý som poznal hlavne ako logo na plakáte na chodbe. Ten plakát to zjavne myslel vážne." },
        "home-4":{ caption:"Kde sa to všetko začalo — Bratislava", blurb:"Tabuľa odchodov na hlavnej stanici, pár minút pred odchodom.", alt:"Tabuľa odchodov na Hlavnej stanici v Bratislave", note:"Posledná fotka doma: tabuľa odchodov v Bratislave, pár minút pred odchodom. Ostatní počítali kufre; ja som počítal, koľko nástupíšť si ešte môžem pomýliť." },
        "home-5":{ caption:"Celá skupina v Drážďanoch", blurb:"Kufre, batohy a konečne všetci na jednom mieste.", alt:"Skupinová fotka Erasmus skupiny s batožinou na stanici v Drážďanoch", note:"Celá skupina, konečne na jednom mieste, s väčším počtom kufrov ako ľudí. Niekde v tej kope je taška, ktorú som potom hodinu hľadal." },
        "week1-1":{ caption:"Učím sa HTML", blurb:"Sklonená hlava nad klávesnicou, spoznávam základy.", alt:"Jano odzadu, píše na počítači v kancelárii", note:"Prvé ráno v Projekt Korrekt: HTML od základov. Kódu som napísal dosť, ale ešte nikdy som nikomu nemusel vysvetľovať, prečo je div práve tam, kde je." },
        "week1-2":{ caption:"Inštalujeme Windows na Macu", blurb:"Nie každý počítač v kancelárii je taký, ako vyzerá.", alt:"Monitor Samsung s inštalačnou obrazovkou Windows vedľa Mac mini", note:"Mac mini, monitor Samsung a inštalátor Windowsu, ktoré všetky tvrdia, že patria k sebe. Nič v tejto dielni nie je celkom to, čím sa zdá — počítače vrátane." },
        "week1-3":{ caption:"Zapájame elektrické zásuvky", blurb:"My traja, stena plná dier a jeden skrutkovač.", alt:"Traja priatelia pri stene s elektrickými zásuvkami a otvorenými otvormi na káble", note:"Toto je tá časť IT kurzu, ktorá v brožúre nie je: my traja, stena plná dier a jeden jediný skrutkovač. Prišiel som za klávesnicou a dostal som stenu." },
        "week1-4":{ caption:"Bezpečnosť na prvom mieste", blurb:"(Nikto neprišiel k úhone.)", alt:"Detailný záber rúk zapájajúcich elektrickú zásuvku dvoma skrutkovačmi", note:"Dva skrutkovače, jedna zásuvka a fotograf s pochybnými prioritami. Na skrinke bolo všetko vypnuté a všetci máme ešte desať prstov." },
        "week1-5":{ caption:"Tabuľa inteligentnej domácnosti", blurb:"Posledná úloha prvého týždňa: nech svetlá robia to, čo im povie tablet.", alt:"Ruka ovláda cez farebné koliesko na tablete panel inteligentnej domácnosti so svetlami, vypínačmi a modulom Loxone, jedno svetlo svieti načerveno", note:"Prvý týždeň sa skončil pri stene plnej vypínačov, svetiel a jednej Loxone krabičky, zapojenej tak, aby to celé riadil tablet. Dosť dlho som vyberal presne ten správny odtieň červenej pre spálňu, v ktorej nikto nespí." },
        "week2-1":{ caption:"Späť za stolmi", blurb:"Druhý týždeň bol o Loxone a Loxone je hlavne o pozeraní.", alt:"Spolužiak si pri stole podopiera bradu rukou a pozerá na softvér Loxone Config na monitore, vedľa Mac mini a na stene za ním panely inteligentnej domácnosti", note:"Druhý týždeň vymenil skrutkovače za softvér: Loxone Config, skoro celý deň. Toto je presne ten výraz, ktorý po dvadsiatich minútach spraví každý." },
        "week2-2":{ caption:"Kuchyňa, spálňa, krabice a drôty", blurb:"Dve miestnosti nakreslené ako bloky, kde je všetko pospájané so všetkým.", alt:"Obrazovka so softvérom Loxone Config, zelené bloky „Intelligent Room Controller“ pre kuchyňu a spálňu, prepojené čiarami so vstupmi a výstupmi", note:"Z každej miestnosti sa stane zelená krabica s tuctom vstupov po jednej strane a výstupov po druhej a spájaš ich čiarami, kým dom nefunguje. Prvé programovanie, pri ktorom chyba zhasne skutočné svetlo." },
        "week2-3":{ caption:"Miniserver", blurb:"Celý dom beží na jednej zelenej krabici na lište.", alt:"Žiarivo zelený Loxone Miniserver na DIN lište v otvorenom elektrickom rozvádzači, okolo neho radové svorky a hnedá, modrá a sieťová kabeláž", note:"Všetko — svetlá, kúrenie, alarm — sa zbieha do tejto zelenej tehly na lište v skrinke. Zvyšok rozvádzača sú len drôty, ktoré sa dohadujú, ako sa k nej dostanú." },
        "week2-4":{ caption:"Dom nakreslený páskou", blurb:"Obývačka, kuchyňa, technická miestnosť — všetko na jednej stene.", alt:"Demonštračná stena inteligentnej domácnosti s miestnosťami vyznačenými čiernou páskou a popismi Living Room, Kitchen a Service Room, so zápustnými svetlami, skleneným dotykovým vypínačom a modulom Loxone, pod nimi zásuvky", note:"Celý dom je jedna stena, na ktorej čierna páska vyznačuje miestnosti, takže obývačka je štyridsať centimetrov od kuchyne. Ladí sa to ľahšie ako skutočný dom a dosiahneš všade." },
        "week2-5":{ caption:"Naozaj to funguje", blurb:"Alarm zapnutý, spálňa 21,8°, kuchyňa 21,9°. To sme my.", alt:"Rozhranie aplikácie Loxone so zapnutým alarmom, ovládaním dverí a svetlami a teplotami pre spálňu 21,8 stupňa a kuchyňu 21,9 stupňa", note:"Dva týždne zapájania a blokových schém a tu to je ako appka: alarm zapnutý, dvere v zozname, spálňa na 21,8 stupňa. Ešte nikdy som nemal takú radosť z jednej desatiny stupňa." },
        "leipzig-1":{ caption:"Hlavná stanica v Lipsku", blurb:"Vraj najväčšia stanica v Európe čo do plochy. Je to cítiť.", alt:"Dlhá pieskovcová fasáda hlavnej stanice v Lipsku z protiľahlej strany ulice, vpravo prechádza žlto-modrá električka", note:"Stanica má veľkosť menšieho mesta a vo vnútri obchodné centrum, takže každá cesta do Lipska začínala desiatimi minútami hľadania správneho východu." },
        "leipzig-2":{ caption:"Dole k S-Bahnu", blurb:"Veľmi dlhé schodisko a veľmi čistý tunel.", alt:"Pohľad dole strmým schodiskom do bielo obloženej stanice S-Bahnu v lipskom mestskom tuneli, dolu cestujúci na nástupišti", note:"Stanice v mestskom tuneli sú samá biela dlaždica a rovná čiara, nasvietené ako operačná sála. U nás doma to tak nevyzerá a fotku som spravil hlavne zo závisti." },
        "leipzig-3":{ caption:"Sklenený kostol univerzity", blurb:"Napoly prednášková sála, napoly katedrála, a celkom zámerne.", alt:"Paulinum Lipskej univerzity na Augustusplatzi, moderná stavba zo skla a kameňa v tvare gotického kostolného priečelia s rozetou", note:"Univerzita postavila sklenenú budovu v tvare kostola, ktorý tu stál, kým ho v šesťdesiatych rokoch nevyhodili do vzduchu. Čudná, ostrohranná vec, pred ktorou stojíš — a mne sa veľmi páčila." },
        "leipzig-4":{ caption:"Tmavý kostol", blurb:"Novogotický, sadzovo čierny a zo všetkých strán zaparkovaný.", alt:"Vysoký tmavý novogotický kostol v Lipsku s dvoma vežami a veľkou rozetou, pred ním autá zaparkované pozdĺž ulice", note:"Čierny kameň, dve veže, obrovská rozeta — a rovno pred tým rad zaparkovaných áut vrátane jedného veľmi žltého. Z vlastných budov tu zjavne nikto nie je nijako unesený." },
        "leipzig-5":{ caption:"Bach pred svojím kostolom", blurb:"Pracoval tu dvadsaťsedem rokov. Socha nevyzerá uvoľnene.", alt:"Kostol svätého Tomáša v Lipsku v zamračený deň, v popredí bronzová socha Johanna Sebastiana Bacha na podstavci", note:"Bach stojí pred Tomášskym kostolom s jednou rukou za chrbtom, akoby sa chystal niekoho zoťať za skúšku. Bol tu dvadsaťsedem rokov kantorom, takže na to mal asi dôvod." },
        "leipzig-6":{ caption:"Bachov hrob", blurb:"Bronzová doska v podlahe a na nej čerstvé kvety.", alt:"Interiér Tomášskeho kostola s pohľadom na zlatý oltár, v popredí bronzová náhrobná doska Johanna Sebastiana Bacha v podlahe s položenými kvetmi", note:"Leží v podlahe pred oltárom, pod jednoduchou bronzovou doskou, na ktorej niekto nechal čerstvé kvety. Zo všetkého, čo sme za dva týždne videli, ma zastavilo práve toto." },
        "leipzig-7":{ caption:"Nástroje za sklom", blurb:"Tristo rokov staré a stále krajšie ako moja gitara.", alt:"Husle a väčší sláčikový nástroj vo vitríne Bachovho múzea, za nimi ručne písaný notový rukopis", note:"Husle a niečo v tvare violy vo vitríne, za nimi jeden z Bachových rukopisov — písmo drobné a úplne isté. Hrám na gitare dosť zle na to, aby ma to zastrašilo." },
        "leipzig-8":{ caption:"Kofola v Lipsku", blurb:"Osemsto kilometrov od domu a na námestí stojí slovenský stánok.", alt:"Ruka drží pohár Kofoly pred slovenským stánkom s jedlom Koliba na lipskom námestí, nad ním veje slovenská vlajka", note:"Zabočili sme za roh trhu a bola tam: slovenská vlajka, stánok Koliba a Kofola z pípy. Ešte nikdy som nemal takú radosť z niečoho, čo doma kúpim za polovicu." },
        "leipzig-9":{ caption:"Do dvora", blurb:"V tejto štvrti má každá stena niečo namaľované.", alt:"Graffiti pokrytý priechod do dvora v Lipsku, nad bránou kovová socha zo šrotu a ručne maľovaný nápis Mrs. Hippie", note:"Brána s plechovou figúrou na streche a nápisom Mrs. Hippie cez celú šírku, za ňou dvor, kde tridsať rokov nikto nič nepremaľoval. Toto je tá časť Lipska, pre ktorú by som sa vrátil." },
        "leipzig-10":{ caption:"Stena z platní", blurb:"Niekto pribil zbierku platní na bok domu.", alt:"Desiatky vinylových platní pribitých v kaskáde na zvetranú stenu dvora v Lipsku, pod nimi bicykle a informačné tabule", note:"Desiatky platní pribitých priamo do omietky, stekajúcich po stene ako voda. Nikto to nestrážil a nikto si žiadnu nezobral, čo o tej štvrti hovorí niečo pekné." },
        "leipzig-11":{ caption:"Pamätník z druhého konca", blurb:"Fotí sa zle. Ani nemusí.", alt:"Pamätník bitky národov v Lipsku ako silueta proti slnku na druhom konci dlhého vodného bazéna", note:"Vidíš ho z druhého konca dlhého vodného bazéna, presne v strede, so slnkom rovno za ním. Vyzerá menej ako pamätník a viac ako niečo, čo pristálo." },
        "leipzig-12":{ caption:"Priamo pod ním", blurb:"Ľudia dole sú tam pre mierku. Nepomáhajú.", alt:"Pamätník bitky národov pohľadom od základne, nad vchodom obrovský kamenný archanjel, dolu na priestranstve drobné postavy ľudí", note:"Hora kameňa s archanjelom veľkým ako dom nad bránou a ľudia pri vchode vyzerajú ako chyba v zábere. Má v tebe vyvolať pocit malosti a robí to veľmi dobre." },
        "leipzig-13":{ caption:"Pod kupolou", blurb:"Štyria kamenní obri sedia v tme a strážia mŕtvych.", alt:"Sieň slávy pamätníka bitky národov z hornej galérie, s kolosálnymi sediacimi kamennými strážcami a vitrážovými oknami", note:"Z hornej galérie sa pozeráš dole na štyri kolosálne sediace postavy, ktoré strážia sieň, a vitráže po nich hádžu farbu. Každý zvuk sa tam vracia asi po štyroch sekundách." },
        "leipzig-14":{ caption:"Lipsko zhora", blurb:"Stálo to za každý schod, a schodov bolo dosť.", alt:"Výhľad z vrcholu pamätníka bitky národov cez vodný bazén na panorámu Lipska v jasný deň", note:"Z plošiny máš celé mesto naraz: dole bazén, potom stromy a potom Lipsko naploho až po horizont. Schodisko hore je úzke, nekonečné a stojí za to." },
        "leipzig-15":{ caption:"Po daždi", blurb:"Stará fabrika na jednej strane, nové kancelárie na druhej, nikde nikto.", alt:"Prázdna mokrá ulica v Lipsku za súmraku, vľavo dlhá stará priemyselná hala s oceľovými oknami, vpravo svetlá moderná kancelárska budova", note:"Stará fabrická hala na jednej strane, nová kancelárska budova na druhej a medzi nimi mokrá cesta, ktorá pohltí všetko svetlo. Lipsko sa prestavuje ulicu po ulici a dá sa to sledovať priamo z chodníka." },
        "dresden-1":{ caption:"Labe z mosta", blurb:"Prvý pohľad na Drážďany: veľmi modrá obloha a rieka plná lodí.", alt:"Rieka Labe z drážďanského mosta, vpravo zakotvené kolesové parníky pri brehu a za nimi sklenená kupola akadémie umení", note:"Prešli sme cez most a celé mesto sa zjavilo naraz — rieka, terasa, parníky vyrovnané pri brehu. Po dvoch týždňoch šedi sa obloha rozhodla, že bude najmodrejšia z celého výletu." },
        "dresden-2":{ caption:"Poľská koruna", blurb:"Brána so zlatou korunou navrchu, lebo jedno kráľovstvo nestačilo.", alt:"Brána Kronentor drážďanského Zwingeru so zlátenou poľskou korunou, pohľad z príjazdovej cesty", note:"Brána do Zwingeru nesie zlatú poľskú korunu, pretože August Silný vládol Sasku aj Poľsku naraz a chcel, aby to každý príchodzí vedel. O zdržanlivosť tu nešlo." },
        "dresden-3":{ caption:"Fontána pri Zwingeri", blurb:"Jeden prúd vody, jazierko a prvé poriadne jesenné lístie.", alt:"Jediný prúd fontány v jazierku pri Zwingeri, za ním na vyvýšenine pavilón Zwingeru, v popredí spadnuté jesenné lístie na tráve", note:"Jazierko, jeden veľmi odhodlaný prúd vody a Zwinger na brehu za ním. Tráva už bola celá pod lístím — prišli sme presne v tom týždni, keď sa menilo ročné obdobie." },
        "dresden-4":{ caption:"Hofkirche", blurb:"Fotené zdola, lebo inak sa to do záberu nezmestí.", alt:"Barokový katolícky dvorný kostol Hofkirche v Drážďanoch pohľadom zdola od schodov, s vysokou vežou, sochami pozdĺž strechy a skupinou ľudí pri vchode", note:"Keď stojíš dole pri schodoch, celý kostol sa ti do mobilu nezmestí, takže máš toto: portál, sochy a vežu, ktorá uteká von zo záberu. Súbor sa mi v notebooku stále volá dresden_zwinger." },
        "dresden-5":{ caption:"Nádvorie paláca", blurb:"Renesančná fasáda, renesančná veža — a bager.", alt:"Nádvorie drážďanského Residenzschlossu s maľovanými renesančnými arkádami a hodinovou vežou nad nimi, vpredu stavebné stroje na rozkopanej zemi", note:"Nádvorie Residenzschlossu: maľované arkády, hodinová veža a uprostred toho všetkého žltý bager. Polovica Drážďan sa donekonečna skladá naspäť dokopy a nikomu to zjavne nevadí." },
        "dresden-6":{ caption:"Vnútri Frauenkirche", blurb:"Lutherov kostol, znovu postavený z vlastnej sutiny a vymaľovaný do pastelov.", alt:"Pastelovo-zlatý barokový interiér drážďanskej Frauenkirche s pohľadom na oltár a organ, s poschodovými emporami a plnými lavicami", note:"Bledoružová, krémová a zlatá, empora na empore a ani jedno voľné miesto. Ťažko sa v hlave udrží, že to celé bolo až do deväťdesiatych rokov kopa kamenia na námestí." },
        "freetime-1":{ caption:"Antonov po zotmení", blurb:"Išli sme pešo na letisko len preto, aby sme videli veľmi veľké lietadlo.", alt:"Veľké nákladné lietadlo Antonov osvetlené v noci na ploche letiska Leipzig/Halle, pohľad cez tmavé pole, v popredí bicykel", note:"Schkeuditz má na konci jednej prechádzky letisko a na tom letisku stoja Antonovy. Mobil z toho urobil rozmazanú kašu, ale stáť po tme vedľa niečoho takého veľkého stálo za tú obchádzku." },
        "freetime-2":{ caption:"Bismarckova veža", blurb:"Ďalšia prechádzka, ďalšia veľká sivá vec na jej konci.", alt:"My traja stojíme na tráve pred kamennou Bismarckovou vežou pri Schkeuditzi v slnečné popoludnie", note:"Takto vyzerali naše voľné popoludnia: vybrať si niečo na mape, dôjsť tam, odfotiť to, vrátiť sa. Tentoraz zavalitá kamenná veža pre Otta von Bismarcka — a slnko vyšlo presne na ten čas, čo trvala táto fotka." },
        "freetime-3":{ caption:"Závod BMW", blurb:"Napoly fabrika, napoly katedrála, s karosériami nad hlavou.", alt:"Rozľahlý betónový interiér závodu BMW v Lipsku, nad návštevníkmi presklený dopravník a dole vystavené limetkovo zelené BMW", note:"Budova je samý surový betón a modré svetlo a nad hlavou ti po sklenenom moste kĺžu nedokončené karosérie, kým tam stojíš. Takto nikto nepostaví fabriku, ak nechce, aby si sa pozeral hore." },
        "freetime-4":{ caption:"Toto by som si zobral", blurb:"Keby v nej nechali kľúče, táto pohľadnica by bola kratšia.", alt:"Čierna cestovná enduro motorka BMW F 850 GS na výstavnom podstavci v hale, za ňou bielo-modro-červený model a okolo stojaci návštevníci", note:"Osemstopäťdesiatka GS na bielom podstavci, na dosah ruky a rozhodne nie na predaj praktikantom. Pozeral som sa na ňu dlhšie než na ktorékoľvek auto." },
        "freetime-5":{ caption:"Halle a žemľa", blurb:"Štyri kostolné veže, jedna červená veža a obed v ruke.", alt:"Selfie nás troch na námestí v Halle, za nami Červená veža a štyri veže kostola Marktkirche, v jednej ruke žemľa", note:"Na námestí v Halle stojí na jednej strane červená veža a na druhej kostol so štyrmi vežami a my sme väčšinu času riešili, kde sa najeme. Vyhrala žemľa." },
        "freetime-6":{ caption:"Štúr v Nemecku", blurb:"Muž, ktorý nám dal spisovnú reč, osemsto kilometrov od domu.", alt:"My traja pózujeme okolo bronzovej busty Ľudovíta Štúra na kamennom podstavci v parku v Halle, jedna ruka spočíva na líci busty", note:"Ľudovít Štúr študoval v Halle, takže v nemeckom parku stojí jeho busta — muž, ktorý nám dal spisovnú reč, ktorou sme sa pred ňou rozprávali. K dôstojnosti toho momentu sme veľmi neprispeli." },
        "freetime-7":{ caption:"Najstaršia čokoládovňa v Nemecku", blurb:"Halloren to v Halle robí od roku 1804.", alt:"Interiér podnikovej predajne čokoládovne Halloren v Halle, s paletami balených čokolád, darčekovými košíkmi s červenými stuhami a regálmi plnými sladkostí", note:"Halloren vyrába čokoládu v Halle od roku 1804, čo z nej robí najstaršiu v Nemecku — a v to popoludnie aj najdrahšiu miestnosť, do akej sme vošli. Každý odtiaľ odchádzal s niečím." }
      }
    }
  };
  /* ===== I18N:END ===== */

  /* Order shown in the language switcher — add a code here (plus a
     block above with the same shape) to support a new language. */
  const LANGUAGES = ["en","de","sk"];
  const LANG_LABELS = { en:"EN", de:"DE", sk:"SK" };

  /* Which top-level dropdown a gallery belongs to (for nav highlighting) */
  const PARENT_OF = { week1:"practice", week2:"practice", leipzig:"culture", dresden:"culture" };

  /* ---------------------------------------------------------- */

  function detectLanguage(){
    try {
      const saved = localStorage.getItem("erasmus-lang");
      if (saved && LANGUAGES.indexOf(saved) !== -1) return saved;
    } catch(e){ /* localStorage unavailable — fall through */ }
    const nav = (navigator.language || "en").slice(0,2).toLowerCase();
    return LANGUAGES.indexOf(nav) !== -1 ? nav : "en";
  }

  const state = { gallery:"home", index:0, lang:detectLanguage(), flipped:false };

  const els = {
    frame: document.getElementById("imageFrame"),
    postcard: document.getElementById("postcard"),
    postcardFront: document.getElementById("postcardFront"),
    postcardBack: document.getElementById("postcardBack"),
    flipBtn: document.getElementById("flipBtn"),
    pcGreeting: document.getElementById("pcGreeting"),
    pcNote: document.getElementById("pcNote"),
    pcSign: document.getElementById("pcSign"),
    pcCountry: document.getElementById("pcCountry"),
    pcMarkPlace: document.getElementById("pcMarkPlace"),
    pcMarkDate: document.getElementById("pcMarkDate"),
    image: document.getElementById("galleryImage"),
    placeholderText: document.getElementById("placeholderText"),
    kicker: document.getElementById("galleryKicker"),
    caption: document.getElementById("galleryCaption"),
    blurb: document.getElementById("galleryBlurb"),
    counter: document.getElementById("galleryCounter"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    langSwitch: document.getElementById("langSwitch"),
    navLinks: Array.prototype.slice.call(document.querySelectorAll(".menu-link[data-gallery]")),
    dropdownLinks: Array.prototype.slice.call(document.querySelectorAll(".dropdown-link[data-gallery]")),
    dropdownToggles: Array.prototype.slice.call(document.querySelectorAll(".dropdown-toggle")),
    dropdownParents: Array.prototype.slice.call(document.querySelectorAll(".has-dropdown")),
    i18nText: Array.prototype.slice.call(document.querySelectorAll("[data-i18n]")),
    i18nAria: Array.prototype.slice.call(document.querySelectorAll("[data-i18n-aria]"))
  };

  function dict(){ return I18N[state.lang] || I18N.en; }

  function getPath(obj, path){
    return path.split(".").reduce(function(o,k){ return (o && o[k] !== undefined) ? o[k] : undefined; }, obj);
  }

  function applyTranslations(){
    document.documentElement.lang = state.lang;
    const ui = dict().ui;
    els.i18nText.forEach(function(el){
      const val = getPath(ui, el.dataset.i18n);
      if (val !== undefined) el.textContent = val;
    });
    els.i18nAria.forEach(function(el){
      const val = getPath(ui, el.dataset.i18nAria);
      if (val !== undefined) el.setAttribute("aria-label", val);
    });
  }

  /* Missing-image fallback: hide the <img> so the placeholder behind it shows */
  els.image.addEventListener("error", function(){
    els.image.classList.add("is-hidden");
  });
  els.image.addEventListener("load", function(){
    if (els.image.getAttribute("src")) els.image.classList.remove("is-hidden");
  });

  function showImage(media, altText, note, meta){
    els.placeholderText.textContent = note;
    /* Hand the photo's proportions to the CSS before the file loads, so
       the card is the right size and shape from the first frame instead
       of growing into place once the image arrives. Clearing it falls
       back to the 3:2 placeholder shape. */
    if (meta && meta.w && meta.h){
      els.image.style.setProperty("--ar", meta.w / meta.h);
    } else {
      els.image.style.removeProperty("--ar");
    }
    /* a portrait card gets the stacked postcard back (see .is-portrait) */
    els.frame.classList.toggle("is-portrait",
      !!(meta && meta.w && meta.h && meta.w < meta.h));
    if (media && media.src){
      els.image.classList.add("is-hidden");
      requestAnimationFrame(function(){
        els.image.alt = altText;
        els.image.src = media.src;
      });
    } else {
      els.image.removeAttribute("src");
      els.image.alt = altText;
      els.image.classList.add("is-hidden");
    }
  }

  /* ---------- postcard back ---------- */

  function postmarkFor(id){
    const meta = PHOTO_META[id] || {};
    return {
      place: meta.place || POSTMARK_PLACE[state.gallery] || "",
      date: meta.date || ""
    };
  }

  /* ISO (YYYY-MM-DD) -> DD.MM.YYYY, the way a German postmark reads.
     Anything else — including the "" that unfilled dates carry —
     comes back empty, and the postmark just shows no date line. */
  function formatPostmarkDate(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "." + m[2] + "." + m[1] : "";
  }

  /* Both faces stay in the DOM, so aria-hidden is what actually keeps
     a screen reader from reading the hidden side of the card. */
  function setFlipped(flipped){
    state.flipped = !!flipped;
    const pc = dict().ui.postcard;
    els.frame.classList.toggle("is-flipped", state.flipped);
    els.postcardFront.setAttribute("aria-hidden", String(state.flipped));
    els.postcardBack.setAttribute("aria-hidden", String(!state.flipped));
    els.flipBtn.setAttribute("aria-pressed", String(state.flipped));
    els.flipBtn.setAttribute("aria-label", state.flipped ? pc.turnBack : pc.turn);
  }

  function toggleFlip(){
    if (GALLERY_STRUCTURE[state.gallery].length === 0) return;
    setFlipped(!state.flipped);
  }

  function render(){
    const ui = dict().ui;
    const captions = dict().captions;
    const ids = GALLERY_STRUCTURE[state.gallery];
    const total = ids.length;
    const label = ui.galleryLabel[state.gallery];

    if (total === 0){
      els.image.removeAttribute("src");
      els.image.style.removeProperty("--ar");
      els.image.classList.add("is-hidden");
      els.placeholderText.textContent = ui.emptyBody.replace("{gallery}", label);
      els.kicker.textContent = label;
      els.caption.textContent = ui.emptyTitle;
      els.blurb.textContent = "";
      els.counter.textContent = "0 / 0";
      els.prevBtn.disabled = true;
      els.nextBtn.disabled = true;
      /* nothing to turn over in an empty gallery */
      setFlipped(false);
      els.flipBtn.disabled = true;
      updateNavHighlight();
      return;
    }
    els.prevBtn.disabled = false;
    els.nextBtn.disabled = false;
    els.flipBtn.disabled = false;

    const id = ids[state.index];
    const media = IMAGES[id] || { src:"" };
    const text = captions[id] || { caption:id, blurb:"", alt:id };

    showImage(media, text.alt, ui.placeholderNote.replace("{caption}", text.caption), PHOTO_META[id]);
    els.kicker.textContent = label;
    els.caption.textContent = text.caption;
    els.blurb.textContent = text.blurb;
    els.counter.textContent = (state.index + 1) + " / " + total;

    /* --- back of the card --- */
    const mark = postmarkFor(id);
    const pc = ui.postcard;
    els.pcGreeting.textContent = mark.place ? pc.greeting.replace("{place}", mark.place) : "";
    els.pcNote.textContent = text.note || text.blurb || "";
    els.pcSign.textContent = pc.sign;
    els.pcCountry.textContent = pc.country;
    els.pcMarkPlace.textContent = mark.place;
    els.pcMarkDate.textContent = formatPostmarkDate(mark.date);
    /* always land on the photo side when the card changes */
    setFlipped(false);

    updateNavHighlight();
  }

  function updateNavHighlight(){
    els.navLinks.forEach(function(btn){
      const isActive = btn.dataset.gallery === state.gallery;
      if (isActive) btn.setAttribute("aria-current","page");
      else btn.removeAttribute("aria-current");
    });
    els.dropdownLinks.forEach(function(btn){
      const isActive = btn.dataset.gallery === state.gallery;
      if (isActive) btn.setAttribute("aria-current","page");
      else btn.removeAttribute("aria-current");
    });
    const parentKey = PARENT_OF[state.gallery];
    document.getElementById("practiceToggle").classList.toggle("parent-active", parentKey === "practice");
    document.getElementById("cultureToggle").classList.toggle("parent-active", parentKey === "culture");
  }

  function showGallery(key){
    if (!GALLERY_STRUCTURE[key]) return;
    state.gallery = key;
    state.index = 0;
    closeAllDropdowns();
    render();
  }

  function stepImage(delta){
    const total = GALLERY_STRUCTURE[state.gallery].length;
    if (total === 0) return;
    state.index = (state.index + delta + total) % total;
    render();
  }

  function setLanguage(lang){
    if (LANGUAGES.indexOf(lang) === -1) return;
    state.lang = lang;
    try { localStorage.setItem("erasmus-lang", lang); } catch(e){ /* ignore */ }
    applyTranslations();
    highlightLangButtons();
    render();
  }

  function highlightLangButtons(){
    Array.prototype.slice.call(els.langSwitch.children).forEach(function(btn){
      btn.setAttribute("aria-current", String(btn.dataset.lang === state.lang));
    });
  }

  function buildLangSwitch(){
    LANGUAGES.forEach(function(code){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-btn";
      btn.dataset.lang = code;
      btn.textContent = LANG_LABELS[code] || code.toUpperCase();
      btn.addEventListener("click", function(){ setLanguage(code); });
      els.langSwitch.appendChild(btn);
    });
    highlightLangButtons();
  }

  /* --- nav wiring --- */
  els.navLinks.forEach(function(btn){
    btn.addEventListener("click", function(){ showGallery(btn.dataset.gallery); });
  });
  els.dropdownLinks.forEach(function(btn){
    btn.addEventListener("click", function(){ showGallery(btn.dataset.gallery); });
  });

  function closeAllDropdowns(){
    els.dropdownParents.forEach(function(li){
      li.classList.remove("open");
      const toggle = li.querySelector(".dropdown-toggle");
      if (toggle) toggle.setAttribute("aria-expanded","false");
    });
  }

  els.dropdownToggles.forEach(function(toggle){
    toggle.addEventListener("click", function(e){
      e.stopPropagation();
      const li = toggle.closest(".has-dropdown");
      const willOpen = !li.classList.contains("open");
      closeAllDropdowns();
      if (willOpen){
        li.classList.add("open");
        toggle.setAttribute("aria-expanded","true");
      }
    });
  });

  document.addEventListener("click", function(){ closeAllDropdowns(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (state.flipped) setFlipped(false);
      closeAllDropdowns();
    }
    if (e.key === "ArrowLeft") stepImage(-1);
    if (e.key === "ArrowRight") stepImage(1);
    if (e.key === " " || e.key === "Enter"){
      /* Buttons (nav, arrows, the flip control itself) keep their own
         native activation — only a keypress on the bare page turns the
         card. The page can't scroll anyway, but preventDefault keeps
         Space from doing anything else surprising. */
      const t = e.target;
      if (t && t.closest && t.closest("button")) return;
      e.preventDefault();
      toggleFlip();
    }
  });

  /* --- postcard flip wiring --- */
  els.postcard.addEventListener("click", toggleFlip);
  els.flipBtn.addEventListener("click", toggleFlip);

  /* --- arrow wiring --- */
  els.prevBtn.addEventListener("click", function(){ stepImage(-1); });
  els.nextBtn.addEventListener("click", function(){ stepImage(1); });

  /* --- init --- */
  buildLangSwitch();
  applyTranslations();
  render();
})();
</script>
</body>
