
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erasmus – Schkeuditz Vitalis</title>
<style>
  /* ============================================================
     DESIGN TOKENS — EDIT COLORS / FONTS HERE
     ============================================================ */
  :root{
    --c-black:#14100E;      /* near-black, warm tint (Germany: black) */
    --c-red:#A9333B;        /* brick/poster red (Germany: red) */
    --c-gold:#D3A248;       /* muted gold (Germany: gold) */
    --c-white:#F7F1E6;      /* warm paper white (Germany: white) */
    --c-stone:#8C8577;      /* neutral stone */
    --c-ink:#2B2621;        /* body text on light surfaces */

    --font-display:"Iowan Old Style","Palatino Linotype","URW Palladio L",Palatino,Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --nav-h:64px;
  }

  *{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    overflow:hidden; /* no page scrolling */
    background:var(--c-black);
    font-family:var(--font-body);
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  button{ font:inherit; }

  .page{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* ============================================================
     BACKGROUND — CSS/SVG "golden-hour Germany" backdrop.
     To use a real photo instead: set a background-image on .bg
     (e.g. background:url('images/bg-leipzig.jpg') center/cover;)
     and remove/hide the <svg class="bg-sky"> below.
     ============================================================ */
  .bg{ position:fixed; inset:0; z-index:0; }
  .bg-sky{ width:100%; height:100%; display:block; }
  .bg-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(20,16,14,.60) 0%,
      rgba(20,16,14,.22) 32%,
      rgba(20,16,14,.30) 60%,
      rgba(20,16,14,.72) 100%);
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  .topnav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    min-height:var(--nav-h);
    padding:10px clamp(14px,4vw,40px);
    background:linear-gradient(180deg, rgba(20,16,14,.92), rgba(20,16,14,.78));
    border-bottom:1px solid rgba(211,162,72,.35);
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:baseline; gap:.5rem;
    color:var(--c-white);
    white-space:nowrap;
  }
  .brand-mark{ color:var(--c-gold); font-size:1.1rem; }
  .brand-main{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(.95rem,1.6vw,1.15rem); letter-spacing:.01em;
  }
  .brand-sub{
    font-family:var(--font-display); font-style:italic;
    color:var(--c-gold); font-size:clamp(.68rem,1.3vw,.8rem);
  }

  .menu{
    list-style:none; display:flex; align-items:center;
    gap:clamp(2px,1vw,8px); margin:0; padding:0; flex-wrap:wrap;
  }
  .menu > li{ position:relative; }
  .menu-link{
    background:none; border:0; cursor:pointer;
    color:var(--c-white);
    text-transform:uppercase; letter-spacing:.09em;
    font-size:clamp(.68rem,1.3vw,.8rem); font-weight:600;
    padding:.55rem .65rem; border-radius:4px;
    position:relative;
  }
  .menu-link::after{
    content:""; position:absolute; left:.65rem; right:.65rem; bottom:.3rem;
    height:2px; background:var(--c-gold);
    transform:scaleX(0); transform-origin:left;
    transition:transform .18s ease;
  }
  .menu-link:hover, .menu-link:focus-visible{ color:var(--c-gold); }
  .menu-link[aria-current="page"]::after,
  .menu-link.parent-active::after{ transform:scaleX(1); }

  .dropdown{
    list-style:none; margin:0; padding:.4rem;
    position:absolute; top:calc(100% + 8px); left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:150px;
    background:var(--c-black);
    border:1px solid rgba(211,162,72,.4);
    border-radius:6px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .has-dropdown.open .dropdown{
    opacity:1; pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .dropdown-link{
    display:block; width:100%; text-align:left;
    background:none; border:0; cursor:pointer;
    color:var(--c-white); text-transform:none;
    font-size:.82rem; letter-spacing:.02em;
    padding:.5rem .6rem; border-radius:4px;
  }
  .dropdown-link:hover, .dropdown-link:focus-visible{
    background:rgba(211,162,72,.15); color:var(--c-gold);
  }
  .dropdown-link[aria-current="page"]{ color:var(--c-gold); font-weight:700; }

  @media (max-width:640px){
    .menu{ width:100%; justify-content:center; }
    .brand{ width:100%; justify-content:center; }
    .dropdown{ left:0; transform:translateY(-6px); }
    .has-dropdown.open .dropdown{ transform:translateY(0); }
  }

  /* ============================================================
     MAIN / GALLERY VIEWER
     ============================================================ */
  main.viewer-main{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(8px,2vh,24px) clamp(10px,3vw,40px);
    position:relative; z-index:1;
  }
  .viewer{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(8px,2.5vw,28px);
    width:100%;
    max-width:1040px;
  }

  .arrow{
    flex:0 0 auto;
    width:clamp(34px,5vw,46px); height:clamp(34px,5vw,46px);
    border-radius:50%;
    background:rgba(20,16,14,.55);
    color:var(--c-white);
    border:1px solid rgba(247,241,230,.4);
    font-size:1.35rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .arrow:hover, .arrow:focus-visible{
    background:var(--c-gold); color:var(--c-black); transform:scale(1.06);
  }
  .arrow:disabled{
    opacity:.35; cursor:default; pointer-events:none;
  }

  .image-frame{
    position:relative;
    min-width:0;              /* let this flex item actually shrink instead of overflowing */
    width:fit-content;
    max-width:100%;           /* real size cap now lives on .img-el below */
    background:var(--c-white);
    padding:12px 12px 0;
    border-radius:8px;
    box-shadow:0 22px 55px rgba(0,0,0,.4);
  }

  /* little postage-stamp accent — purely decorative */
  .stamp{
    position:absolute; top:-10px; right:-10px;
    width:36px; height:44px;
    background:var(--c-white);
    border:3px dashed var(--c-gold);
    border-radius:2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    transform:rotate(6deg);
    box-shadow:0 6px 14px rgba(0,0,0,.25);
  }
  .stamp svg{ width:16px; height:16px; stroke:var(--c-red); fill:none; stroke-width:1.6; }
  .stamp span{ font-size:.5rem; letter-spacing:.06em; color:var(--c-red); font-weight:700; }

  /* img-wrap is sized BY its child (the img), not the other way round —
     this is what keeps the placeholder from drifting outside the postcard
     border on narrow screens (a div with its own aspect-ratio box can
     render wider than its flex parent; a replaced element like <img>
     can't, so we let the <img>'s own box drive the wrapper's size). */
  .img-wrap{
    position:relative;
    display:inline-block;
    max-width:100%;
    border-radius:4px;
    overflow:hidden;
  }
  .img-el{
    position:relative; z-index:1;
    display:block;
    width:auto; height:auto;
    aspect-ratio:3/2;
    /* EDIT: these two lines control the displayed photo size */
    max-width:min(66vw,760px);
    max-height:min(64vh,600px);
    object-fit:cover;
    opacity:1;
    transition:opacity .18s ease;
  }
  .img-el.is-hidden{ opacity:0; }

  .placeholder-fill{
    position:absolute; inset:0; z-index:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:10px; text-align:center;
    color:var(--c-stone);
    background:repeating-linear-gradient(135deg,#efe7d6,#efe7d6 10px,#e6dcc4 10px,#e6dcc4 20px);
  }
  .placeholder-fill svg{ width:26px; height:26px; }
  .placeholder-fill .ph-text{
    font-size:.66rem; line-height:1.3; max-width:220px;
  }

  figcaption{
    padding:10px 6px 14px;
    text-align:center;
  }
  .kicker{
    display:block; font-family:var(--font-display); font-style:italic;
    color:var(--c-red); font-size:.82rem; margin-bottom:2px;
  }
  .caption-main{
    display:block; font-family:var(--font-display); font-weight:700;
    font-size:clamp(.92rem,1.6vw,1.1rem); color:var(--c-ink);
  }
  .caption-blurb{
    display:block; font-size:.72rem; color:var(--c-stone);
    margin-top:4px; max-width:46ch; margin-inline:auto;
  }
  .counter{
    display:block; font-size:.66rem; letter-spacing:.05em;
    color:var(--c-stone); margin-top:6px;
  }

  @media (max-height:560px){
    .img-el{ max-height:34vh; }
    figcaption{ padding:6px 6px 10px; }
    .caption-blurb{ display:none; }
  }
  @media (max-width:420px){
    .image-frame{ padding:8px 8px 0; }
    .arrow{ width:32px; height:32px; font-size:1.1rem; }
    .viewer{ gap:6px; }
    .stamp{ width:28px; height:34px; top:-8px; right:-8px; }
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  .site-footer{
    flex:0 0 auto; z-index:1;
    text-align:center;
    padding:8px 14px;
    font-size:.72rem;
    color:var(--c-stone);
    background:linear-gradient(0deg, rgba(20,16,14,.75), rgba(20,16,14,.35));
    border-top:1px solid rgba(211,162,72,.25);
  }
  .site-footer strong{ color:var(--c-gold); font-weight:600; }

  :focus-visible{ outline:2px solid var(--c-gold); outline-offset:2px; }
</style>
</head>
<body>
<div class="page">

  <div class="bg" aria-hidden="true">

<script>
(function(){
  "use strict";

  /* ============================================================
     GALLERY DATA — EDIT IMAGE PATHS, ALT TEXT AND CAPTIONS HERE
     Each gallery has a display label (used in the nav "kicker")
     and exactly 5 images: { src, alt, caption, blurb }.
     Replace any "src" with a real file (e.g. "images/week1-1.jpg")
     and the placeholder will automatically be replaced by the photo.
     ============================================================ */
  const GALLERY_DATA = {
    home: {
      label: "Erasmus, Schkeuditz",
      images: [
        { src:"images/home-1.jpg", alt:"Placeholder photo: the group at the airport before departure", caption:"Arrival in Germany", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/home-2.jpg", alt:"Placeholder photo: first street view of Schkeuditz", caption:"First look at Schkeuditz", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/home-3.jpg", alt:"Placeholder photo: meeting the host company team", caption:"Meeting the team", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/home-4.jpg", alt:"Placeholder photo: unpacking at the apartment", caption:"Settling into the apartment", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/home-5.jpg", alt:"Placeholder photo: the group posing before day one", caption:"Ready for two weeks ahead", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    },
    week1: {
      label: "Practice, Week 1",
      images: [
        { src:"images/week1-1.jpg", alt:"Placeholder photo: entering the office on day one", caption:"Our first day at the company", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/week1-2.jpg", alt:"Placeholder photo: office tour with a colleague", caption:"Office tour and introductions", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/week1-3.jpg", alt:"Placeholder photo: writing the first lines of code", caption:"First lines of code on the job", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/week1-4.jpg", alt:"Placeholder photo: lunch table with the team", caption:"Lunch break with colleagues", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/week1-5.jpg", alt:"Placeholder photo: leaving the office on Friday", caption:"Wrapping up week one", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    },
    week2: {
      label: "Practice, Week 2",
      images: [
        { src:"images/week2-1.jpg", alt:"Placeholder photo: back at the desk on Monday", caption:"Back at it, week two", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/week2-2.jpg", alt:"Placeholder photo: presenting the project to the team", caption:"Presenting our project", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/week2-3.jpg", alt:"Placeholder photo: two people debugging at a screen", caption:"Debugging together", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/week2-4.jpg", alt:"Placeholder photo: receiving the completion certificate", caption:"Certificate ceremony", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/week2-5.jpg", alt:"Placeholder photo: last goodbyes at the office", caption:"Saying goodbye to the office", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    },
    leipzig: {
      label: "Culture, Leipzig",
      images: [
        { src:"images/leipzig-1.jpg", alt:"Placeholder photo: walking through central Leipzig", caption:"Exploring Leipzig", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/leipzig-2.jpg", alt:"Placeholder photo: Augustusplatz square in the afternoon", caption:"Augustusplatz in the afternoon", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/leipzig-3.jpg", alt:"Placeholder photo: narrow lanes in Leipzig's old town", caption:"Leipzig's old town", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/leipzig-4.jpg", alt:"Placeholder photo: coffee at a Leipzig café", caption:"Coffee break in the city", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/leipzig-5.jpg", alt:"Placeholder photo: street musicians performing downtown", caption:"Street musicians downtown", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    },
    dresden: {
      label: "Culture, Dresden",
      images: [
        { src:"images/dresden-1.jpg", alt:"Placeholder photo: arriving in Dresden for a day trip", caption:"A day trip to Dresden", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/dresden-2.jpg", alt:"Placeholder photo: the Frauenkirche dome", caption:"The Frauenkirche", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/dresden-3.jpg", alt:"Placeholder photo: walking along the Elbe river", caption:"Along the Elbe river", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/dresden-4.jpg", alt:"Placeholder photo: stalls at Dresden's old market", caption:"Dresden's old market", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/dresden-5.jpg", alt:"Placeholder photo: sunset light over the old town skyline", caption:"Golden hour over the city", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    },
    freetime: {
      label: "Free Time",
      images: [
        { src:"images/freetime-1.jpg", alt:"Placeholder photo: the group on a weekend outing", caption:"Weekend adventures", blurb:"Lorem ipsum dolor sit amet, consectetur." },
        { src:"images/freetime-2.jpg", alt:"Placeholder photo: trying a local German dish", caption:"Trying local food", blurb:"Sed do eiusmod tempor incididunt ut labore." },
        { src:"images/freetime-3.jpg", alt:"Placeholder photo: an evening get-together with the group", caption:"Evenings with the group", blurb:"Ut enim ad minim veniam, quis nostrud." },
        { src:"images/freetime-4.jpg", alt:"Placeholder photo: a walk through the countryside", caption:"Exploring the countryside", blurb:"Duis aute irure dolor in reprehenderit." },
        { src:"images/freetime-5.jpg", alt:"Placeholder photo: the group on their final evening", caption:"Last night in Germany", blurb:"Excepteur sint occaecat cupidatat non proident." }
      ]
    }
  };

  /* Which top-level dropdown a gallery belongs to (for nav highlighting) */
  const PARENT_OF = { week1:"practice", week2:"practice", leipzig:"culture", dresden:"culture" };

  /* ---------------------------------------------------------- */

  const state = { gallery:"home", index:0 };

  const els = {
    image: document.getElementById("galleryImage"),
    placeholderText: document.getElementById("placeholderText"),
    kicker: document.getElementById("galleryKicker"),
    caption: document.getElementById("galleryCaption"),
    blurb: document.getElementById("galleryBlurb"),
    counter: document.getElementById("galleryCounter"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    navLinks: Array.prototype.slice.call(document.querySelectorAll(".menu-link[data-gallery]")),
    dropdownLinks: Array.prototype.slice.call(document.querySelectorAll(".dropdown-link[data-gallery]")),
    dropdownToggles: Array.prototype.slice.call(document.querySelectorAll(".dropdown-toggle")),
    dropdownParents: Array.prototype.slice.call(document.querySelectorAll(".has-dropdown"))
  };

  /* Missing-image fallback: hide the <img> so the placeholder behind it shows */
  els.image.addEventListener("error", function(){
    els.image.classList.add("is-hidden");
  });
  els.image.addEventListener("load", function(){
    if (els.image.getAttribute("src")) els.image.classList.remove("is-hidden");
  });

  function render(){
    const gallery = GALLERY_DATA[state.gallery];
    const total = gallery.images.length;

    /* Galleries are no longer fixed at 5 — guard the 0-image case
       (e.g. a brand-new gallery before its first upload) instead of
       indexing into an empty array. */
    if (total === 0){
      els.image.classList.add("is-hidden");
      els.image.removeAttribute("src");
      els.placeholderText.textContent = "No photos in " + gallery.label + " yet.";
      els.kicker.textContent = gallery.label;
      els.caption.textContent = "Nothing here yet";
      els.blurb.textContent = "";
      els.counter.textContent = "0 / 0";
      els.prevBtn.disabled = true;
      els.nextBtn.disabled = true;
      updateNavHighlight();
      return;
    }
    els.prevBtn.disabled = false;
    els.nextBtn.disabled = false;

    const item = gallery.images[state.index];

    els.image.classList.add("is-hidden"); /* fade out briefly */
    requestAnimationFrame(function(){
      els.image.src = item.src;
      els.image.alt = item.alt;
    });

    els.placeholderText.textContent = item.caption + " — add " + item.src;
    els.kicker.textContent = gallery.label;
    els.caption.textContent = item.caption;
    els.blurb.textContent = item.blurb;
    els.counter.textContent = (state.index + 1) + " / " + total;

    updateNavHighlight();
  }

  function updateNavHighlight(){
    els.navLinks.forEach(function(btn){
      const isActive = btn.dataset.gallery === state.gallery;
      if (isActive) btn.setAttribute("aria-current","page");
      else btn.removeAttribute("aria-current");
    });
    els.dropdownLinks.forEach(function(btn){
      const isActive = btn.dataset.gallery === state.gallery;
      if (isActive) btn.setAttribute("aria-current","page");
      else btn.removeAttribute("aria-current");
    });
    const parentKey = PARENT_OF[state.gallery];
    document.getElementById("practiceToggle").classList.toggle("parent-active", parentKey === "practice");
    document.getElementById("cultureToggle").classList.toggle("parent-active", parentKey === "culture");
  }

  function showGallery(key){
    if (!GALLERY_DATA[key]) return;
    state.gallery = key;
    state.index = 0;
    closeAllDropdowns();
    render();
  }

  function stepImage(delta){
    const total = GALLERY_DATA[state.gallery].images.length;
    if (total === 0) return;
    state.index = (state.index + delta + total) % total;
    render();
  }

  /* --- nav wiring --- */
  els.navLinks.forEach(function(btn){
    btn.addEventListener("click", function(){ showGallery(btn.dataset.gallery); });
  });
  els.dropdownLinks.forEach(function(btn){
    btn.addEventListener("click", function(){ showGallery(btn.dataset.gallery); });
  });

  function closeAllDropdowns(){
    els.dropdownParents.forEach(function(li){
      li.classList.remove("open");
      const toggle = li.querySelector(".dropdown-toggle");
      if (toggle) toggle.setAttribute("aria-expanded","false");
    });
  }

  els.dropdownToggles.forEach(function(toggle){
    toggle.addEventListener("click", function(e){
      e.stopPropagation();
      const li = toggle.closest(".has-dropdown");
      const willOpen = !li.classList.contains("open");
      closeAllDropdowns();
      if (willOpen){
        li.classList.add("open");
        toggle.setAttribute("aria-expanded","true");
      }
    });
  });

  document.addEventListener("click", function(){ closeAllDropdowns(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeAllDropdowns();
    if (e.key === "ArrowLeft") stepImage(-1);
    if (e.key === "ArrowRight") stepImage(1);
  });

  /* --- arrow wiring --- */
  els.prevBtn.addEventListener("click", function(){ stepImage(-1); });
  els.nextBtn.addEventListener("click", function(){ stepImage(1); });

  /* --- init --- */
  render();
})();
</script>
</body>
</html>
