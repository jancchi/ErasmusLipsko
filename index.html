<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erasmus – Schkeuditz Vitalis</title>
<style>
  /* ============================================================
     DESIGN TOKENS — EDIT COLORS / FONTS HERE
     ============================================================ */
  :root{
    --c-black:#14100E;      /* near-black, warm tint (Germany: black) */
    --c-red:#A9333B;        /* brick/poster red (Germany: red) */
    --c-gold:#D3A248;       /* muted gold (Germany: gold) */
    --c-white:#F7F1E6;      /* warm paper white (Germany: white) */
    --c-stone:#8C8577;      /* neutral stone */
    --c-ink:#2B2621;        /* body text on light surfaces */

    --font-display:"Iowan Old Style","Palatino Linotype","URW Palladio L",Palatino,Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    --nav-h:64px;
    /* the postcard's white border. Drives .postcard-front's padding AND
     .stage's width, which have to agree or the card can overhang the
     stage and slide under an arrow. */
    --frame-pad:12px;
  }

  *{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    overflow:hidden; /* no page scrolling */
    background:var(--c-black);
    font-family:var(--font-body);
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  button{ font:inherit; }

  .page{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    position:relative;
  }

  /* ============================================================
     BACKGROUND — CSS/SVG "golden-hour Germany" backdrop.
     To use a real photo instead: set a background-image on .bg
     (e.g. background:url('images/bg-leipzig.jpg') center/cover;)
     and remove/hide the <svg class="bg-sky"> below.
     ============================================================ */
  .bg{ position:fixed; inset:0; z-index:0; }
  .bg-sky{ width:100%; height:100%; display:block; }
  .bg-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(20,16,14,.60) 0%,
      rgba(20,16,14,.22) 32%,
      rgba(20,16,14,.30) 60%,
      rgba(20,16,14,.72) 100%);
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */
  .topnav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    min-height:var(--nav-h);
    padding:10px clamp(14px,4vw,40px);
    background:linear-gradient(180deg, rgba(20,16,14,.92), rgba(20,16,14,.78));
    border-bottom:1px solid rgba(211,162,72,.35);
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:baseline; gap:.5rem;
    color:var(--c-white);
    white-space:nowrap;
  }
  .brand-mark{ color:var(--c-gold); font-size:1.1rem; }
  .brand-main{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(.95rem,1.6vw,1.15rem); letter-spacing:.01em;
  }
  .brand-sub{
    font-family:var(--font-display); font-style:italic;
    color:var(--c-gold); font-size:clamp(.68rem,1.3vw,.8rem);
  }

  .menu{
    list-style:none; display:flex; align-items:center;
    gap:clamp(2px,1vw,8px); margin:0; padding:0; flex-wrap:wrap;
  }
  .menu > li{ position:relative; }
  .menu-link{
    background:none; border:0; cursor:pointer;
    color:var(--c-white);
    text-transform:uppercase; letter-spacing:.09em;
    font-size:clamp(.68rem,1.3vw,.8rem); font-weight:600;
    padding:.55rem .65rem; border-radius:4px;
    position:relative;
  }
  .menu-link::after{
    content:""; position:absolute; left:.65rem; right:.65rem; bottom:.3rem;
    height:2px; background:var(--c-gold);
    transform:scaleX(0); transform-origin:left;
    transition:transform .18s ease;
  }
  .menu-link:hover, .menu-link:focus-visible{ color:var(--c-gold); }
  .menu-link[aria-current="page"]::after,
  .menu-link.parent-active::after{ transform:scaleX(1); }

  .dropdown{
    list-style:none; margin:0; padding:.4rem;
    position:absolute; top:calc(100% + 8px); left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:150px;
    background:var(--c-black);
    border:1px solid rgba(211,162,72,.4);
    border-radius:6px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .has-dropdown.open .dropdown{
    opacity:1; pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .dropdown-link{
    display:block; width:100%; text-align:left;
    background:none; border:0; cursor:pointer;
    color:var(--c-white); text-transform:none;
    font-size:.82rem; letter-spacing:.02em;
    padding:.5rem .6rem; border-radius:4px;
  }
  .dropdown-link:hover, .dropdown-link:focus-visible{
    background:rgba(211,162,72,.15); color:var(--c-gold);
  }
  .dropdown-link[aria-current="page"]{ color:var(--c-gold); font-weight:700; }

  @media (max-width:640px){
    .menu{ width:100%; justify-content:center; }
    .brand{ width:100%; justify-content:center; }
    .dropdown{ left:0; transform:translateY(-6px); }
    .has-dropdown.open .dropdown{ transform:translateY(0); }
  }

  /* ============================================================
     MAIN / GALLERY VIEWER
     ============================================================ */
  main.viewer-main{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(8px,2vh,24px) clamp(10px,3vw,40px);
    position:relative; z-index:1;
  }
  .viewer{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(8px,2.5vw,28px);
    width:100%;
    max-width:1040px;
  }

  /* Fixed-width column the card is centred in. The card is only as wide
     as its photo (see .img-el), so without this the flex row re-centres
     on every navigation and both arrows slide sideways — enough that the
     next arrow walks out from under the pointer between clicks. The width
     is the widest a photo can be plus its two white borders, so no card
     ever overhangs it.
     flex-shrink stays enabled (and min-width:0 allows it) so that on a
     very narrow phone the row can still compress instead of pushing the
     arrows off-screen; that shrinking depends on the viewport, never on
     which photo is showing, so the arrows still hold still while you
     navigate. .img-el's max-width:100% is what keeps the photo inside
     the stage when that happens. */
  .stage{
    flex:0 1 auto;
    min-width:0;
    width:calc(min(66vw,760px) + 2 * var(--frame-pad));
    max-width:100%;
    display:flex;
    justify-content:center;
  }

  .arrow{
    flex:0 0 auto;
    width:clamp(34px,5vw,46px); height:clamp(34px,5vw,46px);
    border-radius:50%;
    background:rgba(20,16,14,.55);
    color:var(--c-white);
    border:1px solid rgba(247,241,230,.4);
    font-size:1.35rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .arrow:hover, .arrow:focus-visible{
    background:var(--c-gold); color:var(--c-black); transform:scale(1.06);
  }
  .arrow:disabled{
    opacity:.35; cursor:default; pointer-events:none;
  }

  .image-frame{
    position:relative;
    min-width:0;              /* let this flex item actually shrink instead of overflowing */
    width:fit-content;
    max-width:100%;           /* real size cap lives on .img-el below */
    background:var(--c-white);
    border-radius:8px;
    box-shadow:0 22px 55px rgba(0,0,0,.4);
    perspective:1600px;       /* 3D context for the postcard flip (see POSTCARD below) */
  }

  /* little postage-stamp accent — purely decorative */
  .stamp{
    position:absolute; top:-10px; right:-10px;
    width:36px; height:44px;
    background:var(--c-white);
    border:3px dashed var(--c-gold);
    border-radius:2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    transform:rotate(6deg);
    box-shadow:0 6px 14px rgba(0,0,0,.25);
  }
  .stamp svg{ width:16px; height:16px; stroke:var(--c-red); fill:none; stroke-width:1.6; }
  .stamp span{ font-size:.5rem; letter-spacing:.06em; color:var(--c-red); font-weight:700; }

  /* img-wrap is sized BY its child (the img), not the other way round —
     this is what keeps the placeholder from drifting outside the postcard
     border on narrow screens (a div with its own aspect-ratio box can
     render wider than its flex parent; a replaced element like <img>
     can't, so we let the <img>'s own box drive the wrapper's size). */
  .img-wrap{
    position:relative;
    display:inline-block;
    max-width:100%;
    border-radius:4px;
    overflow:hidden;
  }
  /* --ar is the photo's width/height, set inline per photo by showImage()
     from PHOTO_META. The 1.5 fallback (3:2) is what an empty slot's
     placeholder uses. */
  .img-el{
    position:relative; z-index:1;
    display:block;
    /* No fixed aspect-ratio and contain rather than cover: the photos are
       a mix of portrait (3:4), landscape (4:3) and square, and the old
       fixed 3/2 + object-fit:cover centre-crop cut the top and bottom off
       every portrait one — heads included. Each photo now shows whole.

       The width below is doing the job max-width/max-height used to.
       Those two only keep an image's proportions when width and height
       are auto, and then a not-yet-loaded <img> has no intrinsic size,
       so the card collapses to nothing until the file arrives — which
       now means a real request, not bytes already in the page. Give it
       an explicit width instead and both problems go: the box is right
       from the first frame, and it never needs the file to compute it.
       The third term is the height cap expressed as a width, so the
       photo stays inside BOTH caps without either one squashing it. */
    /* EDIT: these three values control the displayed photo size */
    width:min(66vw, 760px, calc(min(64vh, 600px) * var(--ar, 1.5)));
    /* safety net for when .stage is compressed on a very narrow phone:
       height stays auto, so the ratio is preserved as the width drops */
    max-width:100%;
    height:auto;
    aspect-ratio:var(--ar, 1.5);
    object-fit:contain;
    opacity:1;
    transition:opacity .18s ease;
  }
  .img-el.is-hidden{ opacity:0; }

  .placeholder-fill{
    position:absolute; inset:0; z-index:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:10px; text-align:center;
    color:var(--c-stone);
    background:repeating-linear-gradient(135deg,#efe7d6,#efe7d6 10px,#e6dcc4 10px,#e6dcc4 20px);
  }
  .placeholder-fill svg{ width:26px; height:26px; }
  .placeholder-fill .ph-text{
    font-size:.66rem; line-height:1.3; max-width:220px;
  }

  figcaption{
    padding:10px 6px 14px;
    text-align:center;
  }
  .kicker{
    display:block; font-family:var(--font-display); font-style:italic;
    color:var(--c-red); font-size:.82rem; margin-bottom:2px;
  }
  .caption-main{
    display:block; font-family:var(--font-display); font-weight:700;
    font-size:clamp(.92rem,1.6vw,1.1rem); color:var(--c-ink);
  }
  .caption-blurb{
    display:block; font-size:.72rem; color:var(--c-stone);
    margin-top:4px; max-width:46ch; margin-inline:auto;
  }
  .counter{
    display:block; font-size:.66rem; letter-spacing:.05em;
    color:var(--c-stone); margin-top:6px;
  }

  @media (max-height:560px){
    .img-el{ max-height:34vh; }
    figcaption{ padding:6px 6px 10px; }
    .caption-blurb{ display:none; }
  }
  @media (max-width:420px){
    /* the front face's tighter mobile matting lives with the rest of
       the postcard rules below — it has to come after .postcard-front's
       base padding in source order to win */
    .arrow{ width:32px; height:32px; font-size:1.1rem; }
    .viewer{ gap:6px; }
    .stamp{ width:28px; height:34px; top:-8px; right:-8px; }
  }

  /* ============================================================
     POSTCARD — the whole card turns over. Front is the photo side
     (stamp, image, caption); back is a real divided-back postcard:
     handwritten message on the left, stamp + postmark + address
     lines on the right.

     The 3D chain is .image-frame (perspective) > .postcard
     (preserve-3d) > two .postcard-face children. Two things here
     are load-bearing:

     1. Don't put overflow (or filter/clip-path) on .postcard — a
        non-visible overflow on the same element that carries
        transform-style:preserve-3d flattens the 3D context and the
        flip degrades to a flat fade. Overflow on an ANCESTOR
        (.page) is fine.
     2. Sizing still comes from the <img> (see .img-el). The FRONT
        face sits in normal flow and drives the card's box; the BACK
        face is absolutely positioned to match it — the same trick
        .placeholder-fill already uses. Don't give .postcard or the
        faces their own width/aspect-ratio, or you reintroduce the
        overflow bug that .img-el's sizing exists to avoid.
     ============================================================ */
  .postcard{
    position:relative;
    transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.2,.75,.2,1);
    cursor:pointer;
  }
  .image-frame.is-flipped .postcard{ transform:rotateY(180deg); }

  .postcard-face{
    background:var(--c-white);
    border-radius:8px;
    -webkit-backface-visibility:hidden;
            backface-visibility:hidden;
  }
  .postcard-front{
    margin:0;                 /* <figure> default margin */
    /* the matting that used to live on .image-frame; the same token sets
       .stage's width, so the two can't drift apart */
    padding:var(--frame-pad) var(--frame-pad) 0;
  }
  .postcard-back{
    position:absolute; inset:0;
    transform:rotateY(180deg);
    display:flex;
    gap:clamp(8px,1.6vw,18px);
    padding:clamp(12px,2.2vh,20px) clamp(12px,2vw,20px);
    overflow:hidden;          /* the no-scroll rule applies in here too */
    text-align:left;
  }

  /* --- left half: the message, in ballpoint --- */
  .pc-message{
    flex:1 1 58%; min-width:0;
    display:flex; flex-direction:column;
    /* EDIT: handwriting stack — falls back to the display serif */
    font-family:"Segoe Script","Bradley Hand","Comic Sans MS",var(--font-display);
    color:#3A3A6B;            /* ballpoint blue-black */
  }
  .pc-greeting{
    font-size:clamp(.8rem,1.5vw,1rem); font-weight:700;
    margin-bottom:.4em;
  }
  .pc-note{
    margin:0;
    font-size:clamp(.72rem,1.35vw,.9rem); line-height:1.5;
  }
  .pc-sign{
    margin-top:auto; align-self:flex-end;
    font-size:clamp(.75rem,1.4vw,.95rem);
  }

  /* the printed divider down the middle of a real postcard back */
  .pc-split{
    flex:0 0 1px;
    background:repeating-linear-gradient(180deg,
      var(--c-stone) 0 6px, transparent 6px 12px);
    opacity:.55;
  }

  /* --- right half: stamp, postmark, address --- */
  .pc-address{
    flex:1 1 42%; min-width:0;
    display:flex; flex-direction:column;
    gap:clamp(6px,1.4vh,12px);
  }
  .pc-stamp-zone{
    position:relative; align-self:flex-end;
    width:clamp(42px,7vw,56px);
  }
  .pc-stamp{
    width:100%; aspect-ratio:3/4;
    border:2px dashed var(--c-gold); border-radius:2px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px;
    color:var(--c-red);
  }
  .pc-stamp svg{ width:42%; stroke:currentColor; fill:none; stroke-width:1.6; }
  .pc-stamp-value{ font-size:.5rem; font-weight:700; letter-spacing:.02em; }

  /* cancellation mark, overlapping the stamp the way a real one does */
  .pc-postmark{
    position:absolute; left:-44%; top:16%;
    width:clamp(46px,7.6vw,62px); aspect-ratio:1;
    border:2px solid var(--c-red); border-radius:50%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    color:var(--c-red); opacity:.6;
    transform:rotate(-9deg);
    text-align:center; line-height:1.1;
  }
  .pc-postmark::before,
  .pc-postmark::after{
    content:""; position:absolute; left:9%; right:9%;
    border-top:1px solid currentColor;
  }
  .pc-postmark::before{ top:21%; }
  .pc-postmark::after{ bottom:21%; }
  .pc-mark-place{
    font-size:.42rem; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase;
    max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pc-mark-date{ font-size:.42rem; font-weight:700; }

  .pc-lines{
    display:flex; flex-direction:column;
    gap:clamp(5px,1.2vh,10px);
    margin-top:auto;
    /* keep the ruled lines clear of the flip control in the corner */
    padding-right:clamp(24px,3vw,32px);
  }
  .pc-to{
    font-size:.56rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--c-stone);
  }
  .pc-line{
    min-height:1.15em;
    border-bottom:1px solid rgba(140,133,119,.45);
    font-family:"Segoe Script","Bradley Hand","Comic Sans MS",var(--font-display);
    font-size:clamp(.7rem,1.3vw,.85rem);
    color:#3A3A6B;
  }

  /* A portrait photo makes a portrait card, and a portrait card can't
     carry a side-by-side divided back — both columns end up too narrow
     to read. Stack them instead: message on top, address row beneath.
     showImage() adds .is-portrait whenever the photo is taller than
     it is wide. (Before the photos became real files they were all
     cropped to 3:2 landscape, so this case didn't exist.) */
  .image-frame.is-portrait .postcard-back{
    flex-direction:column;
    gap:clamp(6px,1.4vh,12px);
  }
  .image-frame.is-portrait .pc-message{ flex:1 1 auto; }
  .image-frame.is-portrait .pc-split{
    flex:0 0 1px; width:100%;
    background:repeating-linear-gradient(90deg,
      var(--c-stone) 0 6px, transparent 6px 12px);
  }
  .image-frame.is-portrait .pc-address{
    flex:0 0 auto;
    flex-direction:row; align-items:flex-end;
    gap:clamp(8px,2vw,16px);
  }
  .image-frame.is-portrait .pc-lines{ flex:1 1 auto; margin-top:0; }
  .image-frame.is-portrait .pc-stamp-zone{
    order:2;                /* stamp stays on the right, as on a real card */
    align-self:flex-start;
  }

  /* flip control — deliberately OUTSIDE .postcard so it never rotates */
  .flip-btn{
    position:absolute; z-index:3;
    right:8px; bottom:8px;
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid rgba(169,51,59,.3);
    background:rgba(247,241,230,.88);
    color:var(--c-red);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .2s ease;
  }
  .flip-btn svg{ width:15px; height:15px; }
  .flip-btn:hover, .flip-btn:focus-visible{
    background:var(--c-red); color:var(--c-white); transform:rotate(-40deg);
  }
  .flip-btn:disabled{ opacity:.3; cursor:default; pointer-events:none; }

  /* Short viewports: drop the address block, same call as hiding
     .caption-blurb above — protecting the no-scroll rule. */
  @media (max-height:560px){
    .pc-lines{ display:none; }
    .pc-note{ font-size:.68rem; line-height:1.4; }
    .pc-greeting{ font-size:.78rem; }
  }
  @media (max-width:420px){
    /* retunes both the card's white border and .stage's width at once.
       This used to be a `.postcard-front{padding:...}` override, which
       had to sit AFTER the base rule to win; as a token it can't lose a
       source-order race at all. */
    :root{ --frame-pad:8px; }
    .postcard-back{ padding:10px 12px; gap:8px; }
    .pc-address{ flex-basis:34%; }
    .pc-note{ font-size:.68rem; line-height:1.42; }
    .flip-btn{ width:25px; height:25px; right:6px; bottom:6px; }
    .flip-btn svg{ width:13px; height:13px; }
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  .site-footer{
    flex:0 0 auto; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
    padding:8px 14px;
    font-size:.72rem;
    color:var(--c-stone);
    background:linear-gradient(0deg, rgba(20,16,14,.75), rgba(20,16,14,.35));
    border-top:1px solid rgba(211,162,72,.25);
  }
  .site-footer p{ margin:0; }

  .lang-switch{ display:flex; gap:4px; }
  .lang-btn{
    background:none; border:1px solid rgba(211,162,72,.35);
    color:var(--c-stone); cursor:pointer;
    font-size:.66rem; letter-spacing:.05em; font-weight:600;
    padding:.2rem .45rem; border-radius:4px;
  }
  .lang-btn:hover, .lang-btn:focus-visible{ color:var(--c-gold); border-color:var(--c-gold); }
  .lang-btn[aria-current="true"]{ color:var(--c-black); background:var(--c-gold); border-color:var(--c-gold); }

  :focus-visible{ outline:2px solid var(--c-gold); outline-offset:2px; }
</style>
</head>
<body>
<div class="page">

  <!-- Background: CSS/SVG golden-hour skyline (swap for a real photo — see comment in <style>) -->
  <div class="bg" aria-hidden="true">
    <svg class="bg-sky" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#33201d"/>
          <stop offset="45%" stop-color="#a9333b"/>
          <stop offset="75%" stop-color="#d3a248"/>
          <stop offset="100%" stop-color="#f2dba6"/>
        </linearGradient>
        <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#241f1a"/>
          <stop offset="100%" stop-color="#14100e"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="url(#skyGrad)"/>
      <circle cx="600" cy="420" r="120" fill="#f7ead0" opacity=".5"/>
      <path d="M0,560 Q150,505 300,545 T600,530 T900,555 T1200,520 L1200,800 L0,800 Z" fill="url(#hillGrad)" opacity=".92"/>
      <g fill="#14100e">

        "week2-5":{ caption:"It actually works", blurb:"Alarm armed, bedroom 21.8°, kitchen 21.9°. That was us.", alt:"The Loxone app interface showing a burglar alarm set to Armed, a door entry control, and lights and temperatures for Bedroom at 21.8 degrees and Kitchen at 21.9 degrees", note:"Two weeks of wiring and block diagrams, and here it is as an app: alarm armed, door listed, bedroom at 21.8 degrees. I have never been so pleased about a tenth of a degree." },
        "leipzig-1":{ caption:"Leipzig Hauptbahnhof", blurb:"Reportedly Europe's largest railway station by floor area. It feels it.", alt:"The long sandstone facade of Leipzig Hauptbahnhof seen from across the street, with a yellow and blue tram passing on the right", note:"The station is the size of a small town and has a shopping centre inside it, so every trip into Leipzig started with ten minutes of finding the right way out." },
        "leipzig-2":{ caption:"Down to the S-Bahn", blurb:"A very long staircase and a very clean tunnel.", alt:"Looking down a steep staircase into a white-tiled underground S-Bahn station in Leipzig's city tunnel, with passengers waiting on the platform below", note:"The city tunnel stations are all white tile and straight lines, lit like an operating theatre. Ours at home are not like this, and I took the photo mostly out of envy." },
        "leipzig-3":{ caption:"The university's glass church", blurb:"Half lecture hall, half cathedral, entirely on purpose.", alt:"The Paulinum of Leipzig University on Augustusplatz, a modern glass and stone building shaped like a gothic church front with a rose window", note:"The university built a glass building in the shape of the church that stood here until it was blown up in the sixties. A strange, sharp-edged thing to stand in front of, and I liked it a lot." },
        "leipzig-4":{ caption:"The dark church", blurb:"Neo-gothic, soot-black, and parked in on all sides.", alt:"A tall dark neo-gothic church in Leipzig with twin spires and a large rose window, with cars parked along the street directly in front of it", note:"Black stone, two spires, an enormous rose window — and a row of parked cars pressed right up against the front of it, including a very yellow one. Nobody here seems impressed by their own buildings." },
        "leipzig-5":{ caption:"Bach outside his church", blurb:"He worked here for twenty-seven years. The statue does not look relaxed.", alt:"The Thomaskirche in Leipzig on an overcast day, with the bronze statue of Johann Sebastian Bach on its plinth in the foreground", note:"Bach stands outside the Thomaskirche with one hand behind his back, looking like he is about to tell somebody off about a rehearsal. He was cantor here for twenty-seven years, so he probably had cause." },
        "leipzig-6":{ caption:"Bach's grave", blurb:"A brass slab in the floor with fresh flowers on it.", alt:"The interior of the Thomaskirche looking towards the golden altar, with the bronze grave slab of Johann Sebastian Bach set into the floor in the foreground and flowers laid on it", note:"He is buried in the floor in front of the altar, under a plain brass slab with somebody's fresh flowers on it. Of everything we saw in two weeks, this is the one that actually stopped me." },
        "leipzig-7":{ caption:"Instruments under glass", blurb:"Three hundred years old and still better looking than my guitar.", alt:"A violin and a larger string instrument displayed in a museum vitrine at the Bach museum, with a handwritten music manuscript behind them", note:"A violin and something viola-shaped in a case, with one of Bach's manuscripts behind them — the handwriting is tiny and completely certain. I play guitar badly enough to find that intimidating." },
        "leipzig-8":{ caption:"Kofola in Leipzig", blurb:"Eight hundred kilometres from home and there's a Slovak stall on the market square.", alt:"A hand holding a cup of Kofola in front of a Slovak food stall called Koliba on Leipzig's market square, with a Slovak flag flying above it", note:"We came round the corner of the market and there it was: a Slovak flag, a stall called Koliba, and Kofola on tap. I have never been so pleased to find something I can buy at home for half the price." },
        "leipzig-9":{ caption:"Into the courtyard", blurb:"Every wall in this part of town has something painted on it.", alt:"The graffiti-covered entrance passage to a courtyard in Leipzig, with a scrap-metal sculpture and a hand-painted Mrs. Hippie sign above the gate", note:"A gate with a scrap-metal figure on the roof and Mrs. Hippie painted across it, opening into a yard where nothing has been repainted in thirty years. This is the part of Leipzig I would come back for." },
        "leipzig-10":{ caption:"A wall of records", blurb:"Somebody nailed a record collection to the side of a building.", alt:"Dozens of vinyl records nailed in a cascade across a weathered courtyard wall in Leipzig, with bicycles and information boards below", note:"Dozens of records nailed straight into the plaster, spilling down the wall like water. Nobody was guarding it and nobody had taken any, which says something nice about the neighbourhood." },
        "leipzig-11":{ caption:"The monument, from the far end", blurb:"It doesn't photograph well. It doesn't need to.", alt:"The Monument to the Battle of the Nations in Leipzig silhouetted against the sun at the far end of its long reflecting pool", note:"You see it from the other end of a long pool of water, dead centre, with the sun directly behind it. It looks less like a monument and more like something that landed." },
        "leipzig-12":{ caption:"At the foot of it", blurb:"The people at the bottom are there for scale. They don't help.", alt:"The Monument to the Battle of the Nations seen from its base, with the giant stone archangel above the entrance and tiny figures of people on the plaza below", note:"A hill of stone with an archangel the size of a house over the door, and the people by the entrance look like a mistake in the picture. It is meant to make you feel small and it is very good at its job." },
        "leipzig-13":{ caption:"Inside the dome", blurb:"Four stone giants sitting in the dark, minding the dead.", alt:"The interior hall of the Monument to the Battle of the Nations seen from an upper gallery, with colossal seated stone guardian figures and stained glass windows", note:"From the upper gallery you look down on four colossal seated figures guarding the hall, the stained glass throwing colour across them. Every sound in there takes about four seconds to come back." },
        "leipzig-14":{ caption:"Leipzig from the top", blurb:"Worth every step of the staircase, and there were a lot of steps.", alt:"The view from the top of the Monument to the Battle of the Nations over its reflecting pool towards the Leipzig skyline on a clear day", note:"From the platform you get the whole city at once: the pool below, then trees, then Leipzig going flat all the way to the horizon. The stairs up are narrow, endless and entirely worth it." },
        "leipzig-15":{ caption:"After the rain", blurb:"Old factory on one side, new offices on the other, nobody about.", alt:"An empty wet street in Leipzig at dusk, with a long old industrial hall and its steel-framed windows on the left and a pale modern office block on the right", note:"An old factory hall on one side, a new office block on the other, and the wet road between them taking all the light. Leipzig is being rebuilt street by street and you can watch it happen from the pavement." },
        "dresden-1":{ caption:"The Elbe from the bridge", blurb:"First look at Dresden: a very blue sky and a river full of boats.", alt:"The river Elbe seen from a bridge in Dresden, with paddle steamers moored along the right bank and the glass dome of the art academy behind them", note:"We crossed the bridge and the whole city turned up at once — the river, the terrace, the steamers lined up along the bank. After two weeks of grey the sky decided to be the bluest of the trip." },
        "dresden-2":{ caption:"The Polish crown", blurb:"A gate with a gilded crown on top, because one kingdom wasn't enough.", alt:"The Kronentor gate of the Dresden Zwinger, topped with a gilded Polish crown, seen from the causeway leading up to it", note:"The gate into the Zwinger wears a gold Polish crown, because Augustus the Strong ran Saxony and Poland at the same time and wanted everyone arriving to know it. Subtlety was not the point." },
        "dresden-3":{ caption:"The fountain by the Zwinger", blurb:"One jet of water, a pond, and the first proper autumn leaves.", alt:"A single fountain jet in the Zwinger pond, with a Zwinger pavilion on the rise behind it and fallen autumn leaves on the grass in the foreground", note:"A pond, one very determined jet of water, and the Zwinger sitting on the bank behind it. The grass was already covered in leaves — we had arrived in the exact week the season changed." },
        "dresden-4":{ caption:"The Hofkirche", blurb:"Photographed from the bottom, because there was no other way to fit it in.", alt:"The baroque Katholische Hofkirche in Dresden seen from below at the foot of its steps, with its tall tower, statues along the roofline and a group of people at the entrance", note:"From the bottom of the steps you cannot get the whole church into a phone, so this is what you get: the door, the statues, and a tower running off the top of the frame. The file on my laptop is still called dresden_zwinger." },
        "dresden-5":{ caption:"The palace courtyard", blurb:"Renaissance facade, renaissance tower, and a digger.", alt:"The courtyard of Dresden's Residenzschloss, with painted renaissance arcades and the clock tower above, and construction machinery standing on the dug-up ground", note:"The courtyard of the Residenzschloss: painted arcades, a clock tower, and a yellow digger parked in the middle of it all. Half of Dresden is permanently being put back together and nobody seems bothered." },
        "dresden-6":{ caption:"Inside the Frauenkirche", blurb:"Luther's church, rebuilt out of its own rubble and painted in pastels.", alt:"The pastel and gold baroque interior of the Frauenkirche in Dresden, looking towards the altar and organ, with tiered galleries and full pews", note:"Pale pink, cream and gold, balcony stacked on balcony, and not a free seat in the place. Hard to keep in your head that all of it was a heap of stones on the square until the nineties." },
        "freetime-1":{ caption:"An Antonov after dark", blurb:"We walked to the airport purely to look at a very large aeroplane.", alt:"A large Antonov cargo aircraft lit up at night on the apron at Leipzig/Halle airport, seen across a dark field with a bicycle in the foreground", note:"Schkeuditz has an airport at the end of a walk, and the airport has Antonovs. My phone made a blurry mess of it, but standing near something that big in the dark was worth the detour." },
        "freetime-2":{ caption:"The Bismarck tower", blurb:"Another walk, another large grey thing at the end of it.", alt:"Three of us standing on the grass in front of the stone Bismarck tower near Schkeuditz on a sunny afternoon", note:"The shape of our free afternoons: pick something on the map, walk to it, photograph it, walk back. This one was a squat stone tower for Otto von Bismarck, and the sun came out for exactly as long as this photo took." },
        "freetime-3":{ caption:"The BMW plant", blurb:"Half factory, half cathedral, with car bodies flying overhead.", alt:"The vast concrete interior of the BMW plant in Leipzig, with an elevated glazed conveyor crossing above the visitors and a lime-green BMW on display below", note:"The building is all raw concrete and blue light, and unfinished car bodies slide along a glass bridge over your head while you stand there. Nobody designs a factory like that unless they want you looking up." },
        "freetime-4":{ caption:"The one I'd take", blurb:"If they'd left the keys in it, this postcard would be shorter.", alt:"A black BMW F 850 GS adventure motorcycle on a display plinth indoors, with a white, blue and red one behind it and visitors standing around", note:"An 850 GS on a white plinth, close enough to touch and firmly not for sale to visiting students. I spent longer looking at this than at any of the cars." },
        "freetime-5":{ caption:"Halle, and a bread roll", blurb:"Four church towers, one red tower, and lunch in hand.", alt:"Selfie of three of us on the market square in Halle, with the Red Tower and the four towers of the Marktkirche behind us, and a bread roll in one hand", note:"Halle's market square has a red tower on one side and a church with four towers on the other, and we spent most of our time there deciding where to eat. The bread roll won." },
        "freetime-6":{ caption:"Štúr, in Germany", blurb:"The man who gave us our written language, eight hundred kilometres from home.", alt:"Three of us posing around a bronze bust of Ľudovít Štúr on a stone plinth in a park in Halle, one hand resting on the statue's cheek", note:"Ľudovít Štúr studied in Halle, so his bust stands in a German park — the man who gave us the written language we were speaking while we stood in front of it. We did not treat the moment with the dignity it deserved." },
        "freetime-7":{ caption:"Germany's oldest chocolate factory", blurb:"Halloren have been doing this in Halle since 1804.", alt:"Inside the Halloren chocolate factory shop in Halle, with pallets of boxed chocolate, gift baskets tied with red ribbon and shelves of sweets", note:"Halloren have been making chocolate in Halle since 1804, which makes them the oldest in Germany and, that afternoon, the most expensive room we walked into. Everybody left carrying something." }
      }

      captions: {
        "home-1":{ caption:"Hallo, ich bin Jano", blurb:"Ich arbeite bei Asseco CEIT und wenn ich nicht programmiere, spiele ich wahrscheinlich Factorio.", alt:"Porträt von Jano vor dem Dresdner Hauptbahnhof an einem regnerischen Tag", note:"Tag eins, Dresden, und es hat die ganze Zeit geregnet. Ich bin zum Programmieren hergekommen — niemand hat mich gewarnt, wie viel von den nächsten zwei Wochen mit Schraubenziehern zu tun haben würde." },
        "home-2":{ caption:"Ich spiele auch Gitarre", blurb:"Ein bisschen Musik als Ausgleich zur Bildschirmzeit.", alt:"Jano sitzt zu Hause mit einer Konzertgitarre, auf dem Knie ein grünes slowakisches Liederbuch, dahinter Bücherregale", note:"Das ist das grüne Liederbuch, das das halbe Land irgendwo im Regal stehen hat, und eine Gitarre, die immer dann dran ist, wenn der Bildschirm für heute gewonnen hat. In den Koffer hat sie nicht gepasst — das Einzige, was ich beim Packen bereue." },
        "home-3":{ caption:"Im Rahmen von Erasmus+", blurb:"Zwei Wochen in Deutschland, ermöglicht durch Erasmus+.", alt:"Erasmus+-Grafik vor dem Hintergrund der Europaflagge", note:"Ohne Erasmus+ gäbe es das alles nicht: zwei Wochen Praxis in Deutschland, finanziert von einem Programm, das ich vor allem als Logo auf einem Plakat im Flur kannte. Das Plakat hat es offenbar ernst gemeint." },
        "home-4":{ caption:"Wo alles begann — Bratislava", blurb:"Abfahrtstafel am Hauptbahnhof, kurz vor der Abreise.", alt:"Abfahrtstafel am Hauptbahnhof Bratislava", note:"Das letzte Foto von daheim: die Abfahrtstafel in Bratislava, Minuten vor der Abreise. Alle anderen zählten Gepäckstücke; ich zählte, wie viele Bahnsteige ich noch verwechseln könnte." },
        "home-5":{ caption:"Die ganze Gruppe in Dresden", blurb:"Koffer, Rucksäcke, und endlich alle an einem Ort.", alt:"Gruppenfoto der Erasmus-Gruppe mit Gepäck im Bahnhof Dresden", note:"Die ganze Gruppe, endlich an einem Ort, mit mehr Gepäck als Menschen. Irgendwo in diesem Haufen steckt die Tasche, die ich danach eine Stunde gesucht habe." },
        "week1-1":{ caption:"HTML lernen", blurb:"Kopf unten an der Tastatur, die Grundlagen verstehen.", alt:"Jano von hinten gesehen, tippend an einem Bürocomputer", note:"Erster Morgen bei Projekt Korrekt: HTML von Grund auf. Ich habe schon viel Code geschrieben, musste aber noch nie jemandem erklären, warum ein div genau dort steht, wo es steht." },
        "week1-2":{ caption:"Windows auf einem Mac installieren", blurb:"Nicht jeder Rechner im Büro ist, was er zu sein scheint.", alt:"Ein Samsung-Monitor mit Windows-Installationsbildschirm neben einem Mac mini", note:"Ein Mac mini, ein Samsung-Monitor und ein Windows-Installer, die alle behaupten, sie gehörten zusammen. Nichts in dieser Werkstatt ist ganz, wie es aussieht — die Rechner eingeschlossen." },
        "week1-3":{ caption:"Steckdosen verkabeln", blurb:"Wir zu dritt, eine Wand voller Löcher, und ein Schraubenzieher.", alt:"Drei Freunde vor einer Wand mit Steckdosen und offenen Leitungslöchern", note:"Das ist der Teil des IT-Kurses, der in keinem Prospekt steht: wir zu dritt, eine Wand voller Löcher und ein einziger Schraubenzieher. Ich kam für die Tastatur und bekam die Wand." },
        "week1-4":{ caption:"Sicherheit geht vor", blurb:"(Es kam niemand zu Schaden.)", alt:"Nahaufnahme von Händen, die mit zwei Schraubenziehern eine Steckdose verkabeln", note:"Zwei Schraubenzieher, eine Steckdose und ein Fotograf mit fragwürdigen Prioritäten. Am Kasten war alles abgeschaltet, und alle haben noch zehn Finger." },
        "week1-5":{ caption:"Die Smart-Home-Tafel", blurb:"Die letzte Aufgabe der ersten Woche: die Lampen sollen tun, was das Tablet sagt.", alt:"Eine Hand steuert über ein Farbrad auf dem Tablet eine Smart-Home-Tafel mit Spots, Schaltern und einem Loxone-Modul, ein Spot leuchtet rot", note:"Die erste Woche endete an einer Wand aus Schaltern, Spots und einer Loxone-Box, verkabelt so, dass ein Tablet das Ganze steuert. Ich habe ziemlich lange das genau richtige Rot für ein Schlafzimmer ausgesucht, in dem niemand schläft." },
        "week2-1":{ caption:"Zurück an den Schreibtischen", blurb:"Woche zwei war Loxone, und Loxone ist vor allem Starren.", alt:"Ein Mitschüler stützt am Schreibtisch den Kopf in die Hand und schaut auf die Loxone-Config-Software auf einem Monitor, daneben Mac minis und an der Wand dahinter Smart-Home-Tafeln", note:"Woche zwei tauschte Schraubenzieher gegen Software: Loxone Config, fast den ganzen Tag. Das ist genau das Gesicht, das nach etwa zwanzig Minuten alle machen." },
        "week2-2":{ caption:"Küche, Schlafzimmer, Kästen und Drähte", blurb:"Zwei Räume als Blöcke gezeichnet, in denen alles mit allem verbunden ist.", alt:"Ein Bildschirm mit Loxone Config, grüne Blöcke „Intelligent Room Controller“ für Küche und Schlafzimmer, über Verbindungslinien mit Ein- und Ausgängen verdrahtet", note:"Jeder Raum wird zu einem grünen Kasten mit einem Dutzend Eingängen auf der einen und Ausgängen auf der anderen Seite, und man verbindet sie mit Linien, bis das Haus funktioniert. Das erste Programmieren, bei dem ein Fehler ein echtes Licht ausschaltet." },
        "week2-3":{ caption:"Der Miniserver", blurb:"Das ganze Haus läuft über einen grünen Kasten auf einer Schiene.", alt:"Ein leuchtend grüner Loxone Miniserver auf einer Hutschiene in einem offenen Schaltschrank, umgeben von Reihenklemmen sowie brauner, blauer und Netzwerkverkabelung", note:"Alles — Licht, Heizung, Alarm — läuft auf diesen grünen Ziegel auf einer Schiene im Schrank hinaus. Der Rest im Schaltschrank sind nur Drähte, die sich streiten, wie sie dorthin kommen." },
        "week2-4":{ caption:"Ein Haus aus Klebeband", blurb:"Wohnzimmer, Küche, Hauswirtschaftsraum — alles an einer Wand.", alt:"Eine Smart-Home-Demowand, auf der Räume mit schwarzem Klebeband abgegrenzt und als Living Room, Kitchen und Service Room beschriftet sind, mit Einbauspots, einem Glas-Touchschalter und einem Loxone-Modul, darunter Steckdosen", note:"Das ganze Haus ist eine Wand, auf der schwarzes Klebeband die Räume markiert, also liegt das Wohnzimmer vierzig Zentimeter von der Küche entfernt. Leichter zu debuggen als ein echtes — und viel leichter zu erreichen." },
        "week2-5":{ caption:"Es funktioniert tatsächlich", blurb:"Alarm scharf, Schlafzimmer 21,8°, Küche 21,9°. Das waren wir.", alt:"Die Loxone-App-Oberfläche mit scharf geschalteter Einbruchmeldeanlage, einer Türsteuerung sowie Licht und Temperatur für Schlafzimmer mit 21,8 Grad und Küche mit 21,9 Grad", note:"Zwei Wochen Verkabelung und Blockdiagramme, und hier ist es als App: Alarm scharf, Tür gelistet, Schlafzimmer auf 21,8 Grad. Ich habe mich noch nie so über ein Zehntelgrad gefreut." },
        "leipzig-1":{ caption:"Leipzig Hauptbahnhof", blurb:"Angeblich Europas größter Bahnhof nach Fläche. Man merkt es.", alt:"Die lange Sandsteinfassade des Leipziger Hauptbahnhofs von der gegenüberliegenden Straßenseite, rechts fährt eine gelb-blaue Straßenbahn vorbei", note:"Der Bahnhof hat die Größe einer Kleinstadt und ein Einkaufszentrum darin, also begann jede Fahrt nach Leipzig mit zehn Minuten Suche nach dem richtigen Ausgang." },
        "leipzig-2":{ caption:"Runter zur S-Bahn", blurb:"Eine sehr lange Treppe und ein sehr sauberer Tunnel.", alt:"Blick eine steile Treppe hinunter in eine weiß geflieste S-Bahn-Station im Leipziger City-Tunnel, unten warten Fahrgäste auf dem Bahnsteig", note:"Die Stationen im City-Tunnel sind alles weiße Fliesen und gerade Linien, beleuchtet wie ein OP-Saal. Bei uns zu Hause sieht das anders aus, und ich habe das Foto vor allem aus Neid gemacht." },
        "leipzig-3":{ caption:"Die Glaskirche der Uni", blurb:"Halb Hörsaal, halb Kathedrale, und zwar mit Absicht.", alt:"Das Paulinum der Universität Leipzig am Augustusplatz, ein moderner Bau aus Glas und Stein in Form einer gotischen Kirchenfront mit Fensterrose", note:"Die Universität hat ein Gebäude aus Glas in der Form der Kirche gebaut, die hier stand, bis sie in den Sechzigern gesprengt wurde. Ein seltsames, scharfkantiges Ding davorzustehen — und mir hat es sehr gefallen." },
        "leipzig-4":{ caption:"Die dunkle Kirche", blurb:"Neogotisch, rußschwarz und von allen Seiten zugeparkt.", alt:"Eine hohe dunkle neogotische Kirche in Leipzig mit zwei Türmen und großer Fensterrose, davor parkende Autos direkt an der Straße", note:"Schwarzer Stein, zwei Türme, eine riesige Fensterrose — und direkt davor eine Reihe parkender Autos, darunter ein sehr gelbes. Von den eigenen Gebäuden scheint hier niemand beeindruckt zu sein." },
        "leipzig-5":{ caption:"Bach vor seiner Kirche", blurb:"Siebenundzwanzig Jahre hat er hier gearbeitet. Entspannt sieht die Statue nicht aus.", alt:"Die Thomaskirche in Leipzig an einem bewölkten Tag, im Vordergrund das bronzene Denkmal von Johann Sebastian Bach auf seinem Sockel", note:"Bach steht vor der Thomaskirche, eine Hand hinter dem Rücken, als wolle er gleich jemanden wegen einer Probe zurechtweisen. Er war hier siebenundzwanzig Jahre Kantor, also hatte er vermutlich Grund dazu." },
        "leipzig-6":{ caption:"Bachs Grab", blurb:"Eine Bronzeplatte im Boden, mit frischen Blumen darauf.", alt:"Der Innenraum der Thomaskirche mit Blick zum goldenen Altar, im Vordergrund die bronzene Grabplatte von Johann Sebastian Bach im Boden, darauf liegen Blumen", note:"Er liegt im Boden vor dem Altar, unter einer schlichten Bronzeplatte, auf der frische Blumen von irgendjemandem liegen. Von allem in diesen zwei Wochen hat mich ausgerechnet das angehalten." },
        "leipzig-7":{ caption:"Instrumente hinter Glas", blurb:"Dreihundert Jahre alt und immer noch schöner als meine Gitarre.", alt:"Eine Geige und ein größeres Streichinstrument in einer Museumsvitrine im Bach-Museum, dahinter ein handgeschriebenes Notenmanuskript", note:"Eine Geige und etwas Bratschenförmiges in der Vitrine, dahinter eines von Bachs Manuskripten — die Handschrift ist winzig und vollkommen sicher. Ich spiele schlecht genug Gitarre, um das einschüchternd zu finden." },
        "leipzig-8":{ caption:"Kofola in Leipzig", blurb:"Achthundert Kilometer von zu Hause, und auf dem Markt steht ein slowakischer Stand.", alt:"Eine Hand hält einen Becher Kofola vor einem slowakischen Essensstand namens Koliba auf dem Leipziger Markt, darüber weht eine slowakische Flagge", note:"Wir kamen um die Ecke des Marktes, und da war sie: eine slowakische Fahne, ein Stand namens Koliba und Kofola vom Fass. Ich habe mich noch nie so über etwas gefreut, das ich zu Hause für die Hälfte bekomme." },
        "leipzig-9":{ caption:"Rein in den Hinterhof", blurb:"In dieser Gegend ist auf jede Wand irgendetwas gemalt.", alt:"Die mit Graffiti bedeckte Durchfahrt zu einem Leipziger Hinterhof, über dem Tor eine Schrottskulptur und ein handgemaltes Mrs.-Hippie-Schild", note:"Ein Tor mit einer Schrottfigur auf dem Dach und Mrs. Hippie quer darüber, dahinter ein Hof, in dem seit dreißig Jahren nichts gestrichen wurde. Das ist der Teil von Leipzig, für den ich wiederkäme." },
        "leipzig-10":{ caption:"Eine Wand aus Schallplatten", blurb:"Jemand hat eine Plattensammlung an eine Hauswand genagelt.", alt:"Dutzende Schallplatten in einer Kaskade an eine verwitterte Hinterhofwand in Leipzig genagelt, darunter Fahrräder und Infotafeln", note:"Dutzende Platten direkt in den Putz genagelt, die Wand hinunterlaufend wie Wasser. Niemand passte darauf auf und niemand hatte eine mitgenommen, was etwas Nettes über die Gegend sagt." },
        "leipzig-11":{ caption:"Das Denkmal, vom anderen Ende", blurb:"Es fotografiert sich schlecht. Muss es auch nicht.", alt:"Das Völkerschlachtdenkmal in Leipzig als Silhouette gegen die Sonne am anderen Ende seines langen Wasserbeckens", note:"Man sieht es vom anderen Ende eines langen Wasserbeckens, genau mittig, die Sonne direkt dahinter. Es wirkt weniger wie ein Denkmal als wie etwas, das gelandet ist." },
        "leipzig-12":{ caption:"Ganz unten davor", blurb:"Die Leute unten sind der Maßstab. Sie helfen nicht.", alt:"Das Völkerschlachtdenkmal vom Sockel aus gesehen, darüber der riesige steinerne Erzengel über dem Eingang, unten winzige Menschen auf dem Vorplatz", note:"Ein Berg aus Stein mit einem hausgroßen Erzengel über dem Tor, und die Leute am Eingang wirken wie ein Fehler im Bild. Es soll einen klein machen, und darin ist es sehr gut." },
        "leipzig-13":{ caption:"Unter der Kuppel", blurb:"Vier steinerne Riesen sitzen im Dunkeln und bewachen die Toten.", alt:"Die Ruhmeshalle des Völkerschlachtdenkmals von einer oberen Galerie aus gesehen, mit kolossalen sitzenden Wächterfiguren aus Stein und bunten Glasfenstern", note:"Von der oberen Galerie schaut man auf vier kolossale sitzende Figuren hinunter, die die Halle bewachen, während die Glasfenster Farbe über sie werfen. Jedes Geräusch dort drinnen braucht etwa vier Sekunden, bis es zurückkommt." },
        "leipzig-14":{ caption:"Leipzig von oben", blurb:"Jede Stufe wert — und es waren viele Stufen.", alt:"Der Blick von der Spitze des Völkerschlachtdenkmals über das Wasserbecken auf die Leipziger Skyline an einem klaren Tag", note:"Von der Plattform hat man die ganze Stadt auf einmal: unten das Becken, dann Bäume, dann Leipzig flach bis zum Horizont. Die Treppe hinauf ist eng, endlos und jede Stufe wert." },
        "leipzig-15":{ caption:"Nach dem Regen", blurb:"Alte Fabrik auf der einen Seite, neue Büros auf der anderen, niemand unterwegs.", alt:"Eine leere nasse Straße in Leipzig in der Dämmerung, links eine lange alte Industriehalle mit Stahlfenstern, rechts ein heller moderner Bürobau", note:"Eine alte Fabrikhalle auf der einen Seite, ein neuer Bürobau auf der anderen und dazwischen die nasse Straße, die alles Licht aufnimmt. Leipzig wird Straße für Straße umgebaut, und man kann vom Gehweg aus zusehen." },
        "dresden-1":{ caption:"Die Elbe von der Brücke", blurb:"Erster Blick auf Dresden: ein sehr blauer Himmel und ein Fluss voller Schiffe.", alt:"Die Elbe von einer Dresdner Brücke aus gesehen, rechts die vertäuten Raddampfer am Ufer und dahinter die Glaskuppel der Kunstakademie", note:"Wir gingen über die Brücke und die ganze Stadt war auf einmal da — der Fluss, die Terrasse, die Dampfer am Ufer aufgereiht. Nach zwei Wochen Grau beschloss der Himmel, der blaueste der Reise zu sein." },
        "dresden-2":{ caption:"Die polnische Krone", blurb:"Ein Tor mit vergoldeter Krone obendrauf, weil ein Königreich nicht reichte.", alt:"Das Kronentor des Dresdner Zwingers mit der vergoldeten polnischen Krone, von der Zufahrt aus gesehen", note:"Das Tor in den Zwinger trägt eine goldene polnische Krone, weil August der Starke Sachsen und Polen gleichzeitig regierte und wollte, dass jeder Ankommende das weiß. Zurückhaltung war nicht die Absicht." },
        "dresden-3":{ caption:"Der Springbrunnen am Zwinger", blurb:"Ein Wasserstrahl, ein Teich und die ersten richtigen Herbstblätter.", alt:"Ein einzelner Fontänenstrahl im Zwingerteich, dahinter auf der Anhöhe ein Zwingerpavillon, im Vordergrund Herbstlaub auf der Wiese", note:"Ein Teich, ein sehr entschlossener Wasserstrahl und der Zwinger dahinter am Ufer. Die Wiese lag schon voller Blätter — wir waren genau in der Woche angekommen, in der die Jahreszeit wechselte." },
        "dresden-4":{ caption:"Die Hofkirche", blurb:"Von unten fotografiert, weil sie anders nicht ins Bild passt.", alt:"Die barocke Katholische Hofkirche in Dresden von unten an der Treppe gesehen, mit hohem Turm, Figuren entlang der Dachlinie und einer Gruppe Menschen am Eingang", note:"Unten an der Treppe bekommt man die Kirche mit dem Handy nicht ganz aufs Bild, also gibt es das hier: das Portal, die Figuren und einen Turm, der oben aus dem Rahmen läuft. Auf meinem Laptop heißt die Datei immer noch dresden_zwinger." },
        "dresden-5":{ caption:"Der Schlosshof", blurb:"Renaissancefassade, Renaissanceturm — und ein Bagger.", alt:"Der Schlosshof des Dresdner Residenzschlosses mit bemalten Renaissance-Arkaden und dem Uhrturm darüber, davor Baumaschinen auf aufgegrabenem Boden", note:"Der Hof des Residenzschlosses: bemalte Arkaden, ein Uhrturm und mittendrin ein gelber Bagger. Die halbe Stadt wird dauerhaft wieder zusammengesetzt, und es stört niemanden." },
        "dresden-6":{ caption:"In der Frauenkirche", blurb:"Luthers Kirche, aus dem eigenen Schutt wieder aufgebaut und in Pastell gestrichen.", alt:"Der pastellfarben-goldene Barockinnenraum der Dresdner Frauenkirche mit Blick auf Altar und Orgel, umlaufenden Emporen und vollen Bänken", note:"Blassrosa, Creme und Gold, Empore auf Empore, und kein Platz mehr frei. Schwer im Kopf zu behalten, dass das Ganze bis in die Neunziger ein Steinhaufen auf dem Platz war." },
        "freetime-1":{ caption:"Eine Antonow bei Nacht", blurb:"Wir sind zum Flughafen gelaufen, nur um ein sehr großes Flugzeug anzuschauen.", alt:"Ein großes Antonow-Frachtflugzeug nachts beleuchtet auf dem Vorfeld des Flughafens Leipzig/Halle, über ein dunkles Feld gesehen, im Vordergrund ein Fahrrad", note:"Schkeuditz hat einen Flughafen am Ende eines Spaziergangs, und der Flughafen hat Antonows. Mein Handy hat nur Matsch daraus gemacht, aber im Dunkeln neben etwas so Großem zu stehen war den Umweg wert." },
        "freetime-2":{ caption:"Der Bismarckturm", blurb:"Noch ein Spaziergang, noch ein großes graues Ding am Ende.", alt:"Wir drei stehen an einem sonnigen Nachmittag auf der Wiese vor dem steinernen Bismarckturm bei Schkeuditz", note:"So sahen unsere freien Nachmittage aus: etwas auf der Karte aussuchen, hinlaufen, fotografieren, zurücklaufen. Diesmal ein gedrungener Steinturm für Otto von Bismarck — und die Sonne kam genau so lange heraus, wie dieses Foto gedauert hat." },
        "freetime-3":{ caption:"Das BMW-Werk", blurb:"Halb Fabrik, halb Kathedrale, mit Karosserien über dem Kopf.", alt:"Die weite Betonhalle des BMW-Werks in Leipzig, über den Besuchern eine verglaste Förderbrücke, darunter ein limettengrüner BMW in der Ausstellung", note:"Das Gebäude ist roher Beton und blaues Licht, und über dem Kopf gleiten unfertige Karosserien über eine Glasbrücke, während man dasteht. So baut niemand eine Fabrik, außer er will, dass man nach oben schaut." },
        "freetime-4":{ caption:"Das würde ich nehmen", blurb:"Hätten sie den Schlüssel steckengelassen, wäre diese Karte kürzer.", alt:"Ein schwarzes BMW F 850 GS Reiseenduro-Motorrad auf einem Ausstellungspodest in der Halle, dahinter ein weiß-blau-rotes Modell und herumstehende Besucher", note:"Eine 850 GS auf weißem Podest, zum Anfassen nah und ganz sicher nicht an Praktikanten zu verkaufen. Ich habe sie länger angeschaut als jedes der Autos." },
        "freetime-5":{ caption:"Halle, und ein Brötchen", blurb:"Vier Kirchtürme, ein Roter Turm und das Mittagessen in der Hand.", alt:"Selfie von uns dreien auf dem Marktplatz in Halle, dahinter der Rote Turm und die vier Türme der Marktkirche, in einer Hand ein Brötchen", note:"Auf Halles Marktplatz steht auf der einen Seite ein roter Turm und auf der anderen eine Kirche mit vier Türmen, und wir haben die meiste Zeit damit verbracht, uns aufs Essen zu einigen. Das Brötchen hat gewonnen." },
        "freetime-6":{ caption:"Štúr, in Deutschland", blurb:"Der Mann, der uns die Schriftsprache gab — achthundert Kilometer von zu Hause.", alt:"Wir drei posieren um eine Bronzebüste von Ľudovít Štúr auf einem Steinsockel in einem Park in Halle, eine Hand liegt an der Wange der Büste", note:"Ľudovít Štúr hat in Halle studiert, also steht seine Büste in einem deutschen Park — der Mann, der uns die Schriftsprache gab, in der wir davor redeten. Mit der Würde des Moments haben wir es nicht so genau genommen." },
        "freetime-7":{ caption:"Deutschlands älteste Schokoladenfabrik", blurb:"Halloren macht das in Halle seit 1804.", alt:"Im Werksverkauf der Halloren-Schokoladenfabrik in Halle, mit Paletten voller Pralinenschachteln, Geschenkkörben mit roten Schleifen und Regalen voller Süßigkeiten", note:"Halloren stellt seit 1804 in Halle Schokolade her, womit sie die älteste Deutschlands ist — und an diesem Nachmittag der teuerste Raum, den wir betreten haben. Alle gingen mit etwas wieder hinaus." }
      }
    },
